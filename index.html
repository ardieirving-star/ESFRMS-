      const dupe = state.students.find(s=>s.admissionNo.toLowerCase()===admissionNo.toLowerCase() && s.id!==state.selected.editingStudentId);
      if(dupe){ toast('That admission number is already in use.'); return; }
      const data = {
        name, admissionNo, class: cls, department: departmentsEnabledForClass(cls) ? deptHidden.value : null, gender: document.getElementById('reg-gender').value,
        dob: document.getElementById('reg-dob').value,
        house: document.getElementById('reg-house').value.trim(),
        religion: document.getElementById('reg-religion').value,
        nationality: document.getElementById('reg-nationality').value.trim(),
        stateOfOrigin: document.getElementById('reg-state').value.trim(),
        lga: document.getElementById('reg-lga').value.trim(),
        address: document.getElementById('reg-address').value.trim(),
        bloodGroup: document.getElementById('reg-bloodgroup').value,
        guardianName: document.getElementById('reg-guardian').value.trim(),
        guardianPhone: document.getElementById('reg-phone').value.trim(), photo: state._draftPhoto || null,
      };
      let savedStudent;
      if(state.selected.editingStudentId){
        const idx = state.students.findIndex(s=>s.id===state.selected.editingStudentId);
        state.students[idx] = Object.assign(state.students[idx], data);
        savedStudent = state.students[idx];
        toast('Student updated.'); state.selected.editingStudentId = null;
      } else {
        savedStudent = Object.assign({id:uid(), createdAt:Date.now()}, data);
        state.students.push(savedStudent);
        toast('Student saved.');

      state._draftPhoto = null; saveState(); repoSaveStudent(savedStudent); render();

  const searchInput = document.getElementById('reg-search');

  document.querySelectorAll('[data-edit-student]').forEach(btn=>{ btn.onclick = ()=>{ state.selected.editingStudentId = btn.dataset.editStudent; render(); window.scrollTo(0,0); }; });
  document.querySelectorAll('[data-delete-student]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.deleteStudent; const st = state.students.find(s=>s.id===id);
      confirmAction(`Delete ${st?st.name:'this student'}? This also removes their recorded scores.`, ()=>{
        state.students = state.students.filter(s=>s.id!==id);
        Object.keys(state.scores).forEach(key=>{ if(key.startsWith(id+'__')) delete state.scores[key]; });
        Object.keys(state.remarks).forEach(key=>{ if(key.startsWith(id+'__')) delete state.remarks[key]; });

  const csvFile = document.getElementById('bulk-csv-file');

    box.innerHTML = `
      ${valid.length>0 ? `<div style="font-size:13px;color:var(--green-2);font-weight:700;margin-bottom:8px;">${valid.length} student(s) ready to import:</div>
      <div style="max-height:200px;overflow-y:auto;margin-bottom:10px;">${valid.map(s=>`<div class="list-row"><div class="row-avatar">${esc(initials(s.name))}</div><div class="row-main"><div class="row-name">${esc(s.name)}</div><div class="row-meta">${esc(s.admissionNo)} · ${esc(s.class)}</div></div></div>`).join('')}</div>
      <button type="button" class="btn btn-primary btn-block" id="bulk-commit-btn">${ICONS.save} Import ${valid.length} Student(s)</button>` : ''}
      ${errors.length>0 ? `<div style="font-size:13px;color:var(--danger);font-weight:700;margin-top:12px;margin-bottom:6px;">${errors.length} row(s) skipped:</div><div style="font-size:12px;color:var(--text-dim);line-height:1.6;">${errors.map(e=>esc(e)).join('<br>')}</div>` : ''}
      ${valid.length===0 && errors.length===0 ? `<div class="empty-box"><div class="empty-title">No rows found</div><div class="empty-sub">Check that your CSV has a header row and at least one data row.</div></div>` : ''}
    `;
    const commitBtn = document.getElementById('bulk-commit-btn');
    if(commitBtn) commitBtn.onclick = ()=>{
      valid.forEach(s=>{ state.students.push(s); repoSaveStudent(s); });
      saveState(); render();
      toast(`Imported ${valid.length} student(s).`);
    };
  };
}

/* ============================= SCORE ENTRY ============================= */

  if(sel.scoreMode==='bulk') return renderBulkScoreEntry();

  const student = students.find(s=>s.id===sel.scoreStudentId);

  let bodyHtml = '';

    bodyHtml = `<div class="empty-box"><div class="empty-title">No students available</div><div class="empty-sub">${isAdmin()?'Register a student first.':'No students assigned to your classes yet.'}</div></div>`;

    bodyHtml = `<div class="empty-box"><div class="empty-title">Select a student</div><div class="empty-sub">Choose a student from the panel to enter their scores.</div></div>`;
  } else {
    const key = scoreKey(student.id, sel.scoreTerm);
    const existing = state.scores[key] || {};
    const subjList = subjectsForTeacher(student);
    const isRestrictedTeacher = !isAdmin() && !isFormMasterOf(student.class);
    bodyHtml = `
    <div class="card">
      <div class="card-title">${student.photo?`<img src="${student.photo}" style="width:26px;height:26px;border-radius:6px;object-fit:cover;">`:''} ${esc(student.name)} <span class="badge navy">${esc(student.class)}</span></div>
      <div class="card-sub">${esc(sel.scoreTerm)} · Enter scores per subject — totals update live.${isRestrictedTeacher && subjList.length ? ' Showing only your assigned subject(s).' : ''}</div>

      <table class="score-table">
        <thead><tr><th>Subject</th><th>1st CA (${g.ca1})</th><th>2nd CA (${g.ca2})</th><th>3rd CA (${g.ca3})</th><th>Exam (${g.exam})</th><th>Total</th></tr></thead>
        <tbody>
          ${subjList.map(subj=>{

              <td><input type="number" min="0" max="${g.ca2}" inputmode="numeric" autocomplete="off" spellcheck="false" data-subj="${esc(subj)}" data-field="ca2" value="${s.ca2??''}"></td>
              <td><input type="number" min="0" max="${g.ca3}" inputmode="numeric" autocomplete="off" spellcheck="false" data-subj="${esc(subj)}" data-field="ca3" value="${s.ca3??''}"></td>
              <td><input type="number" min="0" max="${g.exam}" inputmode="numeric" autocomplete="off" spellcheck="false" data-subj="${esc(subj)}" data-field="exam" value="${s.exam??''}"></td>
              <td class="total-cell" data-total-for="${esc(subj)}">${grand||0}</td>

          }).join('')}
        </tbody>
      </table>
      <button type="button" class="btn btn-primary btn-block" id="save-scores-btn" style="margin-top:16px;">${ICONS.save} Save Scores</button>
      `}
    </div>`;
  }
  return `
  <div class="card">
    <div class="card-title">${ICONS.pencil} Score Entry</div>
    <div class="card-sub">Select a student and term, then enter scores per subject.</div>
    <div style="display:flex;gap:8px;margin:10px 0 4px;">
      <button type="button" class="chip active" data-score-mode="single">${ICONS.pencil} Per Student</button>
      <button type="button" class="chip" data-score-mode="bulk">${ICONS.people} Whole Class Grid</button>
    </div>
    <div class="search-box">${ICONS.search}<input type="text" id="score-search" placeholder="Search students..."></div>
    <div class="field"><label>Term</label><select id="score-term">${state.settings.terms.map(t=>`<option ${t===sel.scoreTerm?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="card-sub" style="background:#f0f6fb;padding:12px 14px;border-radius:10px;border:1px solid var(--border);">
      Scoring Breakdown<br>1st C.A. — ${g.ca1} | 2nd C.A. — ${g.ca2} | 3rd C.A. — ${g.ca3}<br>Total C.A. = ${g.ca1+g.ca2+g.ca3} • Exam = ${g.exam}<br><b>Grand Total = ${gradingMax()}</b>
    </div>
    <div id="score-student-list" style="margin-top:14px;max-height:260px;overflow-y:auto;">
      ${students.map(st=>{
        const searchStr = `${st.name} ${st.admissionNo} ${st.class}`.toLowerCase();
        return `<div class="list-row clickable ${st.id===sel.scoreStudentId?'selected':''}" data-search="${esc(searchStr)}" data-pick-student="${st.id}">
          <div class="row-avatar">${st.photo?`<img src="${st.photo}">`:esc(initials(st.name))}</div>
          <div class="row-main"><div class="row-name">${esc(st.name)}</div><div class="row-meta">${esc(st.admissionNo)} · ${esc(st.class)}</div></div>
        </div>`;

function bindScoreEntryEvents(){
  window.__hasUnsavedScoreEdits = false;
  document.querySelectorAll('[data-score-mode]').forEach(btn=>{
    btn.onclick = ()=>{ state.selected.scoreMode = btn.dataset.scoreMode; render(); };
  });
  if(state.selected.scoreMode==='bulk'){ bindBulkScoreEntryEvents(); return; }
  const termSel = document.getElementById('score-term');
  if(termSel) termSel.onchange = ()=>{ state.selected.scoreTerm = termSel.value; render(); };
  document.querySelectorAll('[data-pick-student]').forEach(row=>{ row.onclick = ()=>{ window.__hasUnsavedScoreEdits = false; state.selected.scoreStudentId = row.dataset.pickStudent; render(); }; });
  const search = document.getElementById('score-search');
  if(search) search.addEventListener('input', ()=>{
    const q = search.value.toLowerCase();
    document.querySelectorAll('#score-student-list [data-search]').forEach(row=>{ row.style.display = row.dataset.search.includes(q) ? '' : 'none'; });
  });
  // live total update per subject row
  document.querySelectorAll('.score-table input[data-subj]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      window.__hasUnsavedScoreEdits = true;
      const subj = inp.dataset.subj;
      const ca1 = +document.querySelector(`input[data-subj="${cssEsc(subj)}"][data-field="ca1"]`).value || 0;
      const ca2 = +document.querySelector(`input[data-subj="${cssEsc(subj)}"][data-field="ca2"]`).value || 0;
      const ca3 = +document.querySelector(`input[data-subj="${cssEsc(subj)}"][data-field="ca3"]`).value || 0;
      const exam = +document.querySelector(`input[data-subj="${cssEsc(subj)}"][data-field="exam"]`).value || 0;
      const cell = document.querySelector(`[data-total-for="${cssEsc(subj)}"]`);
      if(cell) cell.textContent = ca1+ca2+ca3+exam;
    });
  });
  const saveBtn = document.getElementById('save-scores-btn');
  if(saveBtn) saveBtn.onclick = ()=>{
    const students = visibleStudents();
    const student = students.find(s=>s.id===state.selected.scoreStudentId);
    if(!student) return;
    const key = scoreKey(student.id, state.selected.scoreTerm);
    // Start from whatever is already saved (other teachers' subjects included)
    // and only touch the subject(s) this teacher is actually allowed to edit.
    const rec = Object.assign({}, state.scores[key]||{});
    const changed = subjectsForTeacher(student);
    changed.forEach(subj=>{
      const ca1 = document.querySelector(`input[data-subj="${cssEsc(subj)}"][data-field="ca1"]`).value;
      const ca2 = document.querySelector(`input[data-subj="${cssEsc(subj)}"][data-field="ca2"]`).value;
      const ca3 = document.querySelector(`input[data-subj="${cssEsc(subj)}"][data-field="ca3"]`).value;
      const exam = document.querySelector(`input[data-subj="${cssEsc(subj)}"][data-field="exam"]`).value;
      if(ca1!==''||ca2!==''||ca3!==''||exam!==''){
        rec[subj] = {ca1:ca1===''?0:+ca1, ca2:ca2===''?0:+ca2, ca3:ca3===''?0:+ca3, exam:exam===''?0:+exam};
      } else {
        delete rec[subj];
      }
    });
    // Pass `changed` so only this teacher's own subjects are written to the cloud,
    // merged into the shared record instead of replacing it.
    state.scores[key] = rec; saveState(); repoSaveScores(key, rec, changed); window.__hasUnsavedScoreEdits = false; toast('Scores saved for '+student.name+'.'); render();
  };
}

/* ============================= BULK (WHOLE CLASS) SCORE ENTRY ============================= */
function renderBulkScoreEntry(){
  const sel = state.selected;
  const g = state.settings.grading;
  const classes = bulkAvailableClasses();
  if(!sel.bulkClass || !classes.includes(sel.bulkClass)) sel.bulkClass = classes[0] || null;
  const subjectsInClass = sel.bulkClass ? bulkAllowedSubjects(sel.bulkClass) : [];
  if(!sel.bulkSubject || !subjectsInClass.includes(sel.bulkSubject)) sel.bulkSubject = subjectsInClass[0] || null;

  let bodyHtml = '';
  if(classes.length===0){
    bodyHtml = `<div class="empty-box"><div class="empty-title">No students available</div><div class="empty-sub">${isAdmin()?'Register a student first.':'No students assigned to your classes yet.'}</div></div>`;
  } else if(!sel.bulkSubject){
    bodyHtml = `<div class="empty-box"><div class="empty-title">No subjects to grade here</div><div class="empty-sub">${isAdmin()?'Add subjects for this class level in Settings → Class Subjects.':'Ask an admin to assign your subject(s) for this class.'}</div></div>`;
  } else {
    const rows = state.students.filter(s=>s.class===sel.bulkClass && subjectsForStudent(s).includes(sel.bulkSubject))
      .sort((a,b)=>a.name.localeCompare(b.name));
    bodyHtml = rows.length===0 ? `<div class="empty-box"><div class="empty-title">No students take this subject</div><div class="empty-sub">No one in ${esc(sel.bulkClass)} is registered for ${esc(sel.bulkSubject)} this term.</div></div>` : `
      <table class="score-table">
        <thead><tr><th>Student</th><th>1st CA (${g.ca1})</th><th>2nd CA (${g.ca2})</th><th>3rd CA (${g.ca3})</th><th>Exam (${g.exam})</th><th>Total</th></tr></thead>
        <tbody>
          ${rows.map(st=>{
            const rec = state.scores[scoreKey(st.id, sel.bulkTerm||sel.scoreTerm)] || {};
            const s = rec[sel.bulkSubject] || {};
            const grand = (+s.ca1||0)+(+s.ca2||0)+(+s.ca3||0)+(+s.exam||0);
            return `<tr>
              <td class="subj-name">${esc(st.name)}<div style="font-weight:400;font-size:11px;color:var(--text-faint);">${esc(st.admissionNo)}</div></td>
              <td><input type="number" min="0" max="${g.ca1}" inputmode="numeric" autocomplete="off" spellcheck="false" data-bulk-student="${st.id}" data-field="ca1" value="${s.ca1??''}"></td>
              <td><input type="number" min="0" max="${g.ca2}" inputmode="numeric" autocomplete="off" spellcheck="false" data-bulk-student="${st.id}" data-field="ca2" value="${s.ca2??''}"></td>
              <td><input type="number" min="0" max="${g.ca3}" inputmode="numeric" autocomplete="off" spellcheck="false" data-bulk-student="${st.id}" data-field="ca3" value="${s.ca3??''}"></td>
              <td><input type="number" min="0" max="${g.exam}" inputmode="numeric" autocomplete="off" spellcheck="false" data-bulk-student="${st.id}" data-field="exam" value="${s.exam??''}"></td>
              <td class="total-cell" data-bulk-total-for="${st.id}">${grand||0}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      <button type="button" class="btn btn-primary btn-block" id="save-bulk-scores-btn" style="margin-top:16px;">${ICONS.save} Save Whole Class</button>
    `;
  }

  return `
  <div class="card">
    <div class="card-title">${ICONS.pencil} Score Entry</div>
    <div class="card-sub">Enter one subject's scores for an entire class at once — quicker than one student at a time.</div>
    <div style="display:flex;gap:8px;margin:10px 0 4px;">
      <button type="button" class="chip" data-score-mode="single">${ICONS.pencil} Per Student</button>
      <button type="button" class="chip active" data-score-mode="bulk">${ICONS.people} Whole Class Grid</button>
    </div>
    <div class="field"><label>Term</label><select id="bulk-term">${state.settings.terms.map(t=>`<option ${t===(sel.bulkTerm||sel.scoreTerm)?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="field"><label>Class</label><select id="bulk-class">${classes.map(c=>`<option value="${esc(c)}" ${c===sel.bulkClass?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
    ${subjectsInClass.length>0 ? `<div class="field"><label>Subject</label><select id="bulk-subject">${subjectsInClass.map(su=>`<option value="${esc(su)}" ${su===sel.bulkSubject?'selected':''}>${esc(su)}</option>`).join('')}</select></div>` : ''}
  </div>
  <div class="card">${bodyHtml}</div>`;
}
function bindBulkScoreEntryEvents(){
  window.__hasUnsavedScoreEdits = false;
  const sel = state.selected;
  const termSel = document.getElementById('bulk-term');
  if(termSel) termSel.onchange = ()=>{ sel.bulkTerm = termSel.value; render(); };
  const classSel = document.getElementById('bulk-class');
  if(classSel) classSel.onchange = ()=>{ sel.bulkClass = classSel.value; sel.bulkSubject = null; render(); };
  const subjSel = document.getElementById('bulk-subject');
  if(subjSel) subjSel.onchange = ()=>{ sel.bulkSubject = subjSel.value; render(); };
  document.querySelectorAll('.score-table input[data-bulk-student]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      window.__hasUnsavedScoreEdits = true;
      const sid = inp.dataset.bulkStudent;
      const ca1 = +document.querySelector(`input[data-bulk-student="${cssEsc(sid)}"][data-field="ca1"]`).value || 0;
      const ca2 = +document.querySelector(`input[data-bulk-student="${cssEsc(sid)}"][data-field="ca2"]`).value || 0;
      const ca3 = +document.querySelector(`input[data-bulk-student="${cssEsc(sid)}"][data-field="ca3"]`).value || 0;
      const exam = +document.querySelector(`input[data-bulk-student="${cssEsc(sid)}"][data-field="exam"]`).value || 0;
      const cell = document.querySelector(`[data-bulk-total-for="${cssEsc(sid)}"]`);
      if(cell) cell.textContent = ca1+ca2+ca3+exam;
    });
  });
  const saveBtn = document.getElementById('save-bulk-scores-btn');
  if(saveBtn) saveBtn.onclick = ()=>{
    const term = sel.bulkTerm || sel.scoreTerm;
    const subject = sel.bulkSubject;
    let count = 0;
    document.querySelectorAll('.score-table input[data-bulk-student][data-field="ca1"]').forEach(inp=>{
      const sid = inp.dataset.bulkStudent;
      const ca1 = document.querySelector(`input[data-bulk-student="${cssEsc(sid)}"][data-field="ca1"]`).value;
      const ca2 = document.querySelector(`input[data-bulk-student="${cssEsc(sid)}"][data-field="ca2"]`).value;
      const ca3 = document.querySelector(`input[data-bulk-student="${cssEsc(sid)}"][data-field="ca3"]`).value;
      const exam = document.querySelector(`input[data-bulk-student="${cssEsc(sid)}"][data-field="exam"]`).value;
      const key = scoreKey(sid, term);
      const rec = Object.assign({}, state.scores[key]||{});
      if(ca1!==''||ca2!==''||ca3!==''||exam!==''){
        rec[subject] = {ca1:ca1===''?0:+ca1, ca2:ca2===''?0:+ca2, ca3:ca3===''?0:+ca3, exam:exam===''?0:+exam};
      } else {
        delete rec[subject];
      }
      state.scores[key] = rec; repoSaveScores(key, rec, [subject]); count++;
    });
    saveState(); window.__hasUnsavedScoreEdits = false; toast(`Saved ${subject} for ${count} student(s).`);
  };
}

function bindReportCardEvents(){
  const termSel = document.getElementById('report-term');
  if(termSel) termSel.onchange = ()=>{ state.selected.reportTerm = termSel.value; render(); };
  document.querySelectorAll('[data-pick-report]').forEach(row=>{ row.onclick = ()=>{ state.selected.reportStudentId = row.dataset.pickReport; render(); }; });
  const search = document.getElementById('report-search');
  if(search) search.addEventListener('input', ()=>{
    const q = search.value.toLowerCase();
    document.querySelectorAll('#report-student-list [data-search]').forEach(row=>{ row.style.display = row.dataset.search.includes(q) ? '' : 'none'; });
  });
  const printBtn = document.getElementById('print-report-btn');
  if(printBtn) printBtn.onclick = ()=>window.print();
  function recomputeAttendanceAbsent(){
    const openEl = document.getElementById('rs-att-open');
    const presentEl = document.getElementById('rs-att-present');
    const absentEl = document.getElementById('rs-att-absent');
    if(!openEl || !presentEl || !absentEl) return;
    const open = openEl.value===''?null:+openEl.value;
    const present = presentEl.value===''?null:+presentEl.value;
    absentEl.value = (open!==null && present!==null) ? Math.max(0, open-present) : '';
  }
  const attOpenEl = document.getElementById('rs-att-open');
  const attPresentEl = document.getElementById('rs-att-present');
  if(attOpenEl) attOpenEl.addEventListener('input', recomputeAttendanceAbsent);
  if(attPresentEl) attPresentEl.addEventListener('input', recomputeAttendanceAbsent);
  recomputeAttendanceAbsent();
  function currentRemarkKey(){ return scoreKey(state.selected.reportStudentId, state.selected.reportTerm); }
  const autoFillBtn = document.getElementById('auto-fill-teacher-remark');
  if(autoFillBtn) autoFillBtn.onclick = ()=>{
    const summary = computeStudentTermSummary(state.selected.reportStudentId, state.selected.reportTerm);
    if(!summary){ toast('No scores yet to base a remark on.', true); return; }
    const remarkInput = document.getElementById('teacher-remark');
    if(remarkInput) remarkInput.value = formMasterRemarkFor(summary.avgPct);
  };
  const autoFillPrincipalBtn = document.getElementById('auto-fill-principal-remark');
  if(autoFillPrincipalBtn) autoFillPrincipalBtn.onclick = ()=>{
    const summary = computeStudentTermSummary(state.selected.reportStudentId, state.selected.reportTerm);
    if(!summary){ toast('No scores yet to base a remark on.', true); return; }
    const remarkInput = document.getElementById('principal-remark');
    if(remarkInput) remarkInput.value = principalRemarkFor(summary.avgPct);
  };
  document.querySelectorAll('[data-rate-trait]').forEach(btn=>{
    btn.onclick = ()=>{
      const key = currentRemarkKey();
      if(!state.remarks[key]) state.remarks[key] = {};
      const group = btn.dataset.rateGroup;
      if(!state.remarks[key][group]) state.remarks[key][group] = {};
      state.remarks[key][group][btn.dataset.rateTrait] = +btn.dataset.rateVal;
      saveState(); repoSaveRemarks(key, state.remarks[key]); render();
    };
  });
  const saveRemarksBtn = document.getElementById('save-remarks-btn');
  if(saveRemarksBtn) saveRemarksBtn.onclick = ()=>{
    const key = currentRemarkKey();
    const subjectRemarks = {};
    document.querySelectorAll('[data-subject-remark]').forEach(inp=>{ subjectRemarks[inp.dataset.subjectRemark] = inp.value; });
    state.remarks[key] = Object.assign({}, state.remarks[key], {
      teacher: document.getElementById('teacher-remark').value,
      principal: document.getElementById('principal-remark').value,
      attendanceOpen: document.getElementById('rs-att-open').value.trim(),
      attendancePresent: document.getElementById('rs-att-present').value.trim(),
      attendanceAbsent: document.getElementById('rs-att-absent').value.trim(),
      closingDate: document.getElementById('rs-closing-date').value.trim(),
      nextTermBegins: document.getElementById('rs-next-term').value.trim(),
      nextTermFees: document.getElementById('rs-next-fees').value.trim(),
      subjectRemarks,
    });
    saveState(); repoSaveRemarks(key, state.remarks[key]); toast('Remarks saved.');
  };
}

/* ============================= CUMULATIVE RESULTS ============================= */
function renderCumulative(){
  const students = fullAccessStudents();
  const classes = isAdmin() ? allClasses() : (currentUser()?.formTeacherClasses||[]);
  const cls = state.selected.cumulativeClass || classes[0] || null;
  let tableHtml = '';
  if(!cls){
    tableHtml = `<div class="empty-box"><div class="empty-title">No classes available</div><div class="empty-sub">${isAdmin()?'Add classes in Settings first.':'Cumulative results are only available for classes you are the Form Master of.'}</div></div>`;
  } else {
    const classStudents = students.filter(s=>s.class===cls);
    if(classStudents.length===0){
      tableHtml = `<div class="empty-box"><div class="empty-title">No students in ${esc(cls)}</div><div class="empty-sub">Register students in this class to see cumulative results.</div></div>`;
    } else {
      const rows = classStudents.map(st=>{
        const perTerm = state.settings.terms.map(term=>{ const sum = computeStudentTermSummary(st.id, term); return sum ? Math.round(sum.avgPct) : null; });
        const valid = perTerm.filter(v=>v!==null);
        const cumulative = valid.length ? Math.round(valid.reduce((a,b)=>a+b,0)/valid.length) : null;
        return {name:st.name, admissionNo:st.admissionNo, perTerm, cumulative};
      }).sort((a,b)=>(b.cumulative===null?-1:b.cumulative)-(a.cumulative===null?-1:a.cumulative));
      // assign class position based on average (cumulative) score — school uses average system for positioning
      let rank = 0;
      const withPosition = rows.map(r=>{ if(r.cumulative!==null){ rank++; return Object.assign({}, r, {position:rank}); } return Object.assign({}, r, {position:null}); });
      tableHtml = `
      <table class="score-table">
        <thead><tr><th>Pos</th><th>Student</th>${state.settings.terms.map(t=>`<th>${esc(t)}</th>`).join('')}<th>Cumulative Avg</th><th>Grade</th></tr></thead>
        <tbody>${withPosition.map(r=>{
          const g = r.cumulative!==null ? gradeOf(r.cumulative) : null;
          return `<tr><td>${r.position?ordinal(r.position):'-'}</td><td class="subj-name">${esc(r.name)}</td>${r.perTerm.map(v=>`<td>${v===null?'-':v+'%'}</td>`).join('')}<td class="total-cell">${r.cumulative===null?'-':r.cumulative+'%'}</td><td>${g?g.grade:'-'}</td></tr>`;
        }).join('')}</tbody>
      </table>`;
    }
  }
  return `
  <div class="card">
    <div class="card-title">${ICONS.layers} Cumulative Results</div>
    <div class="card-sub">Average performance per student across First, Second and Third Term, ranked by class — this position matches the Report Card.</div>
    <div class="field"><label>Class</label>
      <select id="cumulative-class">${classes.length===0?'<option>No classes yet</option>':classes.map(c=>`<option value="${esc(c)}" ${c===cls?'selected':''}>${esc(c)}</option>`).join('')}</select>
    </div>
    ${tableHtml}
  </div>`;
}
function bindCumulativeEvents(){
  const sel = document.getElementById('cumulative-class');
  if(sel) sel.onchange = ()=>{ state.selected.cumulativeClass = sel.value; render(); };
}

/* ============================= ANALYTICS ============================= */
function renderAnalytics(){
  const hasData = Object.values(state.scores).some(r=>Object.keys(r).length>0);
  if(!hasData) return `<div class="card"><div class="card-title">${ICONS.chart} Analytics</div><div class="empty-box"><div class="empty-title">No data to analyse</div><div class="empty-sub">Record some scores to see analytics.</div></div></div>`;
  const classStats = {}; allClasses().forEach(c=>classStats[c] = {sum:0,count:0});
  state.students.forEach(st=>{ state.settings.terms.forEach(term=>{ const sum = computeStudentTermSummary(st.id, term); if(sum){ if(!classStats[st.class]) classStats[st.class]={sum:0,count:0}; classStats[st.class].sum += sum.avgPct; classStats[st.class].count++; } }); });
  const subjStats = {}; allSubjectsUnique().forEach(s=>subjStats[s]={sum:0,count:0});
  Object.values(state.scores).forEach(rec=>{ Object.keys(rec).forEach(subj=>{ const s = rec[subj]; const grand = (+s.ca1||0)+(+s.ca2||0)+(+s.ca3||0)+(+s.exam||0); const pct = grand/gradingMax()*100; if(!subjStats[subj]) subjStats[subj]={sum:0,count:0}; subjStats[subj].sum += pct; subjStats[subj].count++; }); });
  const perf = []; state.students.forEach(st=>{ state.settings.terms.forEach(term=>{ const sum = computeStudentTermSummary(st.id, term); if(sum) perf.push({name:st.name, cls:st.class, term, pct:sum.avgPct}); }); });
  perf.sort((a,b)=>b.pct-a.pct); const top5 = perf.slice(0,5);
  return `
  <div class="card"><div class="card-title">${ICONS.chart} Class Averages</div>
    ${Object.keys(classStats).filter(c=>classStats[c].count>0).map(c=>{ const avg = Math.round(classStats[c].sum/classStats[c].count); return `<div class="bar-row"><div class="bar-row-top"><span>${esc(c)}</span><span>${avg}%</span></div><div class="bar-track"><div class="bar-fill" style="width:${avg}%;"></div></div></div>`; }).join('') || '<div class="empty-sub">No class data yet.</div>'}
  </div>
  <div class="card"><div class="card-title">${ICONS.book} Subject Performance</div>
    ${Object.keys(subjStats).filter(s=>subjStats[s].count>0).sort((a,b)=>(subjStats[b].sum/subjStats[b].count)-(subjStats[a].sum/subjStats[a].count)).map(s=>{ const avg = Math.round(subjStats[s].sum/subjStats[s].count); return `<div class="bar-row"><div class="bar-row-top"><span>${esc(s)}</span><span>${avg}%</span></div><div class="bar-track"><div class="bar-fill" style="width:${avg}%;"></div></div></div>`; }).join('') || '<div class="empty-sub">No subject data yet.</div>'}
  </div>
  <div class="card" style="border-left:4px solid var(--green);"><div class="card-title">${ICONS.medal} Top 5 Performers</div>
    ${top5.map((p,i)=>`<div class="list-row"><div class="row-avatar">${i+1}</div><div class="row-main"><div class="row-name">${esc(p.name)}</div><div class="row-meta">${esc(p.cls)} · ${esc(p.term)}</div></div><span class="badge">${Math.round(p.pct)}%</span></div>`).join('')}
  </div>`;
}

        <div class="row-actions">
          <button type="button" class="icon-btn" data-edit-teacher="${t.id}" title="Edit">${ICONS.edit}</button>

function bindTeachersEvents(){
  const chipsWrap = document.getElementById('t-classes-toggle');
  if(chipsWrap) chipsWrap.querySelectorAll('[data-class-chip]').forEach(chip=>{ chip.onclick = ()=>chip.classList.toggle('active'); });
  const formTeacherWrap = document.getElementById('t-formteacher-toggle');
  if(formTeacherWrap) formTeacherWrap.querySelectorAll('[data-formteacher-chip]').forEach(chip=>{ chip.onclick = ()=>chip.classList.toggle('active'); });
  const subjectsWrap = document.getElementById('t-subjects-toggle');
  if(subjectsWrap) subjectsWrap.querySelectorAll('[data-subject-chip]').forEach(chip=>{ chip.onclick = ()=>chip.classList.toggle('active'); });
  const sigInput = document.getElementById('t-signature-input');
  if(sigInput) sigInput.onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      const compressed = await compressSignatureImage(reader.result);
      document.getElementById('t-signature-preview').innerHTML = `<img src="${compressed}" style="object-fit:contain;">`;
      if(state.selected.editingUserId){
        const u = state.users.find(u=>u.id===state.selected.editingUserId);
        if(u){ u.signature = compressed; saveState(); repoSaveUser(u); toast('Signature updated.'); }
      } else {
        state._draftTeacherSignature = compressed;
      }
    };
    reader.readAsDataURL(file);
  };
  const sigRemoveBtn = document.getElementById('t-signature-remove');
  if(sigRemoveBtn) sigRemoveBtn.onclick = ()=>{
    document.getElementById('t-signature-preview').innerHTML = '<span style="font-size:11px;color:var(--text-faint);">No signature</span>';
    if(state.selected.editingUserId){
      const u = state.users.find(u=>u.id===state.selected.editingUserId);
      if(u){ u.signature = null; saveState(); repoSaveUser(u); toast('Signature removed.'); }
    } else {
      state._draftTeacherSignature = null;
    }
  };
  const form = document.getElementById('teacher-form');
  if(form) form.onsubmit = (e)=>{
    e.preventDefault();
    const name = document.getElementById('t-name').value.trim();
    const username = document.getElementById('t-username').value.trim();
    const password = document.getElementById('t-password').value.trim();
    if(!name || !username || !password){ toast('Name, username and password are required.'); return; }
    const dupe = state.users.find(u=>u.username.toLowerCase()===username.toLowerCase() && u.id!==state.selected.editingUserId);
    if(dupe){ toast('That username is already taken.'); return; }
    const assignedClasses = Array.from(chipsWrap.querySelectorAll('.chip.active')).map(c=>c.dataset.classChip);
    if(assignedClasses.length===0){ toast('Assign at least one class before saving.'); return; }
    const formTeacherClasses = formTeacherWrap ? Array.from(formTeacherWrap.querySelectorAll('.chip.active')).map(c=>c.dataset.formteacherChip) : [];
    const subjectsTaught = subjectsWrap ? Array.from(subjectsWrap.querySelectorAll('.chip.active')).map(c=>c.dataset.subjectChip) : [];
    const secQ = document.getElementById('t-secq').value.trim() || 'What is your favourite colour?';
    const secA = document.getElementById('t-seca').value.trim() || 'blue';
    let savedUser;
    const wasApproving = state.selected.editingUserId && state.users.find(u=>u.id===state.selected.editingUserId)?.status==='pending';
    if(state.selected.editingUserId){
      const idx = state.users.findIndex(u=>u.id===state.selected.editingUserId);
      state.users[idx] = Object.assign(state.users[idx], {name, username, password, assignedClasses, formTeacherClasses, subjectsTaught, securityQuestion:secQ, securityAnswer:secA, status:'approved'});
      savedUser = state.users[idx];
      toast(wasApproving ? 'Teacher approved and activated.' : 'Teacher account updated.');
      state.selected.editingUserId = null;
    } else {
      savedUser = {id:uid(), role:'teacher', name, username, password, assignedClasses, formTeacherClasses, subjectsTaught, securityQuestion:secQ, securityAnswer:secA, status:'approved', signature: state._draftTeacherSignature||null};
      state.users.push(savedUser);
      state._draftTeacherSignature = null;
      toast('Teacher account created.');
    }
    saveState(); repoSaveUser(savedUser); render();
  };
  const cancelBtn = document.getElementById('cancel-edit-teacher');
  if(cancelBtn) cancelBtn.onclick = ()=>{ state.selected.editingUserId = null; render(); };
  document.querySelectorAll('[data-edit-teacher]').forEach(btn=>{ btn.onclick = ()=>{ state.selected.editingUserId = btn.dataset.editTeacher; render(); window.scrollTo(0,0); }; });
  document.querySelectorAll('[data-approve-teacher]').forEach(btn=>{ btn.onclick = ()=>{ state.selected.editingUserId = btn.dataset.approveTeacher; render(); window.scrollTo(0,0); }; });
  document.querySelectorAll('[data-delete-teacher]').forEach(btn=>{
    btn.onclick = ()=>{
      const id = btn.dataset.deleteTeacher; const t = state.users.find(u=>u.id===id);
      confirmAction(`Remove teacher account for ${t?t.name:'this teacher'}?`, ()=>{
        state.users = state.users.filter(u=>u.id!==id); saveState(); repoDeleteUser(id); render(); toast('Teacher account removed.');
      });
    };
  });
}

function bindSettingsEvents(){
  const connectBtn = document.getElementById('connect-sync-btn');
  if(connectBtn) connectBtn.onclick = async ()=>{
    if(connectBtn.disabled) return;
    const raw = document.getElementById('sync-config-input').value.trim();
    if(!raw){ toast('Paste your Firebase config first.', true); return; }
    const cfg = parseFirebaseConfig(raw);
    if(!cfg){ toast('Could not read that — paste the whole "const firebaseConfig = { ... }" block from Firebase, exactly as shown.', true); return; }
    const required = ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'];
    const missing = required.filter(k=>!cfg[k]);
    if(missing.length){ toast('Missing from your config: '+missing.join(', ')+'. Go back to Firebase and copy the whole block again — scroll up, the top usually has apiKey and authDomain.', true); return; }
    if(cfg.projectId==='yourproject' || cfg.apiKey==='AIza...' || String(cfg.apiKey).includes('...')){
      toast('That still has the example placeholder values in it — paste your own project\'s real config, not the example text.', true); return;
    }
    const doConnect = async ()=>{
      connectBtn.disabled = true;
      try{ await initSync(cfg, false, raw); }
      finally{ connectBtn.disabled = false; }
    };
    if(state.students.length>0){
      confirmAction(`This device already has ${state.students.length} student(s) saved locally. If the cloud is empty, this data will automatically upload and become the shared copy. If the cloud already has different data (because another device connected first), that shared data will replace what's on this device instead. Export a backup first if you want to be safe. Continue connecting?`, doConnect);
    } else {
      await doConnect();
    }
  };
  const disconnectBtn = document.getElementById('disconnect-sync-btn');
  if(disconnectBtn) disconnectBtn.onclick = ()=>{
    confirmAction('Disconnect sync? This device will go back to fully offline-only mode.', ()=>{ disconnectSync(); toast('Sync disconnected.'); });
  };
  const pushAllBtn = document.getElementById('push-all-btn');
  if(pushAllBtn) pushAllBtn.onclick = ()=>{
    confirmAction('Push this device\'s local data to the cloud? This overwrites the cloud copy with what\'s on this device.', ()=>{ repoPushAll(); });
  };
  const generateTeacherCopyBtn = document.getElementById('generate-teacher-copy-btn');
  if(generateTeacherCopyBtn) generateTeacherCopyBtn.onclick = ()=>{
    if(!fb.currentConfig){ toast('Could not find the sync config — try disconnecting and reconnecting once, then try this again.', true); return; }
    try{
      const configJson = JSON.stringify(fb.currentConfig);
      const html = PRISTINE_HTML_SNAPSHOT.replace(
        'const BAKED_SYNC_CONFIG = null;',
        'const BAKED_SYNC_CONFIG = ' + configJson + ';'
      );
      if(!html.includes(configJson)){ toast('Could not prepare the teacher copy — please tell your admin/developer.', true); return; }
      const blob = new Blob([html], {type:'text/html'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'school-app-teachers.html';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
      toast('Downloaded — share this file with teachers. It connects automatically, nothing for them to set up.');
    }catch(e){ toast('Could not generate teacher copy: '+e.message, true); }
  };
  const exportBtn = document.getElementById('export-backup-btn');
  if(exportBtn) exportBtn.onclick = ()=>{
    try{
      const payload = JSON.stringify({ type:'esfrms-backup', exportedAt: new Date().toISOString(), state: state }, null, 0);
      const blob = new Blob([payload], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const dateStr = new Date().toISOString().slice(0,10);
      a.href = url; a.download = `esfrms-backup-${dateStr}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
      toast('Backup downloaded — keep it safe, you\'ll import it after updating the app.');
    }catch(e){ toast('Could not create backup: '+e.message, true); }
  };
  const importInput = document.getElementById('import-backup-input');
  if(importInput) importInput.onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        const incoming = parsed && parsed.state ? parsed.state : parsed;
        if(!incoming || !incoming.students || !incoming.settings){ toast('This file does not look like a valid backup.', true); return; }
        confirmAction('Import this backup? It will replace all current students, scores, and settings in the app with the data from this file.', ()=>{
          const wasLoggedIn = state.isLoggedIn, uid2 = state.currentUserId;
          state = Object.assign(defaultState(), incoming, { isLoggedIn: wasLoggedIn, currentUserId: uid2, view:'settings', sidebarOpen:false });
          saveState(); repoPushAll(); render();
          toast('Backup restored successfully.');
        });
      }catch(err){ toast('Could not read that file — is it a valid backup JSON?', true); }
    };
    reader.readAsText(file);
  };
  const logoInput = document.getElementById('settings-logo-input');
  if(logoInput) logoInput.onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ state.settings.logo = reader.result; saveState(); repoSaveSettings(); render(); toast('Logo updated.'); };
    reader.readAsDataURL(file);
  };
  const form = document.getElementById('settings-form');
  if(form) form.onsubmit = (e)=>{
    e.preventDefault();
    state.settings.schoolName = document.getElementById('set-schoolname').value.trim() || state.settings.schoolName;
    state.settings.shortNameNavy = document.getElementById('set-navyname').value.trim();
    state.settings.shortNameGreen = document.getElementById('set-greenname').value.trim();
    state.settings.systemName = document.getElementById('set-systemname').value.trim();
    state.settings.tagline = document.getElementById('set-tagline').value.trim();
    state.settings.phone = document.getElementById('set-phone').value.trim();
    state.settings.email = document.getElementById('set-email').value.trim();
    state.settings.address = document.getElementById('set-address').value.trim();
    state.settings.description = document.getElementById('set-desc').value.trim();
    state.settings.session = document.getElementById('set-session').value.trim();
    state.settings.principalName = document.getElementById('set-principal').value.trim();
    state.settings.principalTitle = document.getElementById('set-principal-title').value;
    state.settings.schoolDaysOpen = document.getElementById('set-school-days-open').value.trim();
    state.settings.nextTermFees = document.getElementById('set-next-term-fees').value.trim();
    saveState(); repoSaveSettings(); render(); toast('School profile saved.');
  };
  const principalTitleSelect = document.getElementById('set-principal-title');
  if(principalTitleSelect) principalTitleSelect.onchange = ()=>{
    const t = principalTitleSelect.value;
    const nameLabel = document.getElementById('set-principal-name-label');
    const sigLabelWrap = document.getElementById('set-principal-sig-label');
    if(nameLabel) nameLabel.firstChild.textContent = t+"'s Name";
    if(sigLabelWrap && sigLabelWrap.firstChild) sigLabelWrap.firstChild.textContent = t+"'s Signature ";
  };
  const principalSigInput = document.getElementById('settings-principal-sig-input');
  if(principalSigInput) principalSigInput.onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      const compressed = await compressSignatureImage(reader.result);
      state.settings.principalSignature = compressed; saveState(); repoSaveSettings(); render(); toast('Signature updated.');
    };
    reader.readAsDataURL(file);
  };
  const principalSigRemove = document.getElementById('settings-principal-sig-remove');
  if(principalSigRemove) principalSigRemove.onclick = ()=>{
    state.settings.principalSignature = null; saveState(); repoSaveSettings(); render(); toast('Signature removed.');
  };
  const gradingForm = document.getElementById('grading-form');
  if(gradingForm) gradingForm.onsubmit = (e)=>{
    e.preventDefault();
    state.settings.grading = { ca1:+document.getElementById('grade-ca1').value||0, ca2:+document.getElementById('grade-ca2').value||0, ca3:+document.getElementById('grade-ca3').value||0, exam:+document.getElementById('grade-exam').value||0 };
    saveState(); repoSaveSettings(); render(); toast('Grading model updated.');
  };
  document.querySelectorAll('[data-level-tab]').forEach(btn=>{
    btn.onclick = ()=>{ state.selected.settingsLevel = btn.dataset.levelTab; render(); };
  });
  document.querySelectorAll('[data-remove-level]').forEach(btn=>{
    btn.onclick = ()=>{
      const key = btn.dataset.removeLevel;
      const g2 = state.settings.classGroups.find(gr=>gr.key===key);
      if(!g2) return;
      const studentsInLevel = state.students.filter(s=>g2.classes.includes(s.class)).length;
      const warn = studentsInLevel>0
        ? `${studentsInLevel} student(s) are currently in ${g2.label}. Removing this level will NOT delete those students, but they'll need to be reassigned to a different class. `
        : '';
      confirmAction(`${warn}Remove the "${g2.label}" level and all its classes and subjects? This cannot be undone.`, ()=>{
        state.settings.classGroups = state.settings.classGroups.filter(gr=>gr.key!==key);
        delete state.settings.subjectsByGroup[key];
        if(state.selected.settingsLevel===key) state.selected.settingsLevel = state.settings.classGroups[0]?.key || null;
        saveState(); repoSaveSettings(); render(); toast(`"${g2.label}" level removed.`);
      });
    };
  });
  document.querySelectorAll('[data-remove-level-class]').forEach(btn=>{
    btn.onclick = ()=>{
      const g2 = state.settings.classGroups.find(gr=>gr.key===state.selected.settingsLevel);
      if(g2) g2.classes.splice(+btn.dataset.removeLevelClass,1);
      saveState(); repoSaveSettings(); render(); toast('Class removed.');
    };
  });
  document.querySelectorAll('[data-remove-level-subject]').forEach(btn=>{
    btn.onclick = ()=>{
      const key = state.selected.settingsLevel;
      if(state.settings.subjectsByGroup[key]) state.settings.subjectsByGroup[key].splice(+btn.dataset.removeLevelSubject,1);
      saveState(); repoSaveSettings(); render(); toast('Subject removed.');
    };
  });
  const addLevelClassBtn = document.getElementById('add-level-class-btn');
  if(addLevelClassBtn) addLevelClassBtn.onclick = ()=>{
    const inp = document.getElementById('new-level-class-input'); const val = inp.value.trim();
    if(!val){ toast('Type a class name first.', true); return; }
    const g2 = state.settings.classGroups.find(gr=>gr.key===state.selected.settingsLevel);
    if(g2 && g2.classes.includes(val)){ toast('That class already exists in this level.', true); return; }
    if(val && g2){ g2.classes.push(val); saveState(); repoSaveSettings(); render(); toast('Class "'+val+'" saved.'); }
  };
  const addLevelSubjectBtn = document.getElementById('add-level-subject-btn');
  if(addLevelSubjectBtn) addLevelSubjectBtn.onclick = ()=>{
    const inp = document.getElementById('new-level-subject-input'); const val = inp.value.trim();
    if(!val){ toast('Type a subject name first.', true); return; }
    const key = state.selected.settingsLevel;
    if(!state.settings.subjectsByGroup[key]) state.settings.subjectsByGroup[key] = [];
    if(state.settings.subjectsByGroup[key].includes(val)){ toast('That subject is already in this level.', true); return; }
    state.settings.subjectsByGroup[key].push(val); saveState(); repoSaveSettings(); render(); toast('Subject "'+val+'" saved.');
  };
  const addLevelBtn = document.getElementById('add-level-btn');
  if(addLevelBtn) addLevelBtn.onclick = ()=>{
    const inp = document.getElementById('new-level-input'); const val = inp.value.trim();
    if(!val){ toast('Type a level name first.', true); return; }
    const key = val.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || uid();
    if(state.settings.classGroups.some(g2=>g2.key===key)){ toast('That level already exists.', true); return; }
    state.settings.classGroups.push({key, label:val, classes:[]});
    state.settings.subjectsByGroup[key] = [];
    state.selected.settingsLevel = key;
    saveState(); repoSaveSettings(); render(); toast('Level "'+val+'" saved.');
  };
  const deptToggleBox = document.getElementById('level-dept-toggle');
  if(deptToggleBox) deptToggleBox.onchange = ()=>{
    const g2 = state.settings.classGroups.find(gr=>gr.key===state.selected.settingsLevel);
    if(g2){ g2.departmentsEnabled = deptToggleBox.checked; saveState(); repoSaveSettings(); render(); toast(g2.departmentsEnabled ? 'Departments enabled for '+g2.label+'.' : 'Departments disabled for '+g2.label+'.'); }
  };
  document.querySelectorAll('[data-dept-tab]').forEach(btn=>{
    btn.onclick = ()=>{ state.selected.settingsDept = btn.dataset.deptTab; render(); };
  });
  document.querySelectorAll('[data-remove-dept-subject]').forEach(btn=>{
    btn.onclick = ()=>{
      const d = state.settings.departments.find(x=>x.key===state.selected.settingsDept);
      if(d) d.subjects.splice(+btn.dataset.removeDeptSubject,1);
      saveState(); repoSaveSettings(); render(); toast('Subject removed.');
    };
  });
  const addDeptSubjBtn = document.getElementById('add-dept-subject-btn');
  if(addDeptSubjBtn) addDeptSubjBtn.onclick = ()=>{
    const inp = document.getElementById('new-dept-subject-input'); const val = inp.value.trim();
    if(!val){ toast('Type a subject name first.', true); return; }
    const d = state.settings.departments.find(x=>x.key===state.selected.settingsDept);
    if(d && d.subjects.includes(val)){ toast('That subject is already in this department.', true); return; }
    if(val && d){ d.subjects.push(val); saveState(); repoSaveSettings(); render(); toast('Subject "'+val+'" saved.'); }
  };
  const addDeptBtn = document.getElementById('add-dept-btn');
  if(addDeptBtn) addDeptBtn.onclick = ()=>{
    const inp = document.getElementById('new-dept-input'); const val = inp.value.trim();
    if(!val){ toast('Type a department name first.', true); return; }
    const key = val.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || uid();
    if(state.settings.departments.some(d=>d.key===key)){ toast('That department already exists.', true); return; }
    state.settings.departments.push({key, label:val, subjects:[]});
    state.selected.settingsDept = key;
    saveState(); repoSaveSettings(); render(); toast('Department "'+val+'" saved.');
  };
  const adminPassForm = document.getElementById('admin-pass-form');
  if(adminPassForm) adminPassForm.onsubmit = (e)=>{
    e.preventDefault();
    const u = currentUser(); if(!u) return;
    const newPass = document.getElementById('admin-newpass').value.trim();
    if(newPass) u.password = newPass;
    u.securityQuestion = document.getElementById('admin-secq').value || u.securityQuestion;
    u.securityAnswer = document.getElementById('admin-seca').value.trim() || u.securityAnswer;
    saveState(); repoSaveUser(u); render(); toast('Your login details were updated.');
  };
}

/* ============================= SHELL EVENTS ============================= */
function bindShellEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{ el.addEventListener('click', ()=>navigate(el.dataset.nav)); });
  const hamburger = document.getElementById('hamburger-btn'); if(hamburger) hamburger.onclick = toggleSidebar;
  const sidebarClose = document.getElementById('sidebar-close'); if(sidebarClose) sidebarClose.onclick = toggleSidebar;
  const overlay = document.getElementById('overlay'); if(overlay) overlay.onclick = toggleSidebar;
  const signout = document.getElementById('signout-btn');
  if(signout) signout.onclick = ()=>{
    confirmAction('Sign out of the school console?', ()=>{
      state.isLoggedIn = false; state.currentUserId = null; state.view = 'login';
      saveState(); render();
    });
  };
  const downloadUpdateBtn = document.getElementById('download-update-btn');
  if(downloadUpdateBtn) downloadUpdateBtn.onclick = ()=>{
    try{
      const blob = new Blob([fb.remoteHtml], {type:'text/html'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `school-app-${fb.remoteVersion}.html`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 2000);
      toast('Downloaded. Open the new file, then delete this old one.');
    }catch(e){ toast('Could not download update: '+e.message, true); }
  };
  const dismissUpdateBtn = document.getElementById('dismiss-update-btn');
  if(dismissUpdateBtn) dismissUpdateBtn.onclick = ()=>{ fb.updateDismissed = true; render(); };
  if(state.view==='register') bindRegisterEvents();
  if(state.view==='scoreEntry') bindScoreEntryEvents();
  if(state.view==='reportCard') bindReportCardEvents();
  if(state.view==='allStudents') bindAllStudentsEvents();
  if(state.view==='settings') bindSettingsEvents();
  if(state.view==='teachers') bindTeachersEvents();
  if(state.view==='cumulative') bindCumulativeEvents();
}

/* ============================= INIT ============================= */
function showFatalError(err){
  const app = document.getElementById('app');
  app.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#eef2f4;">
    <div style="max-width:440px;background:#fff;border:1px solid #dc2626;border-radius:14px;padding:24px;color:#1c2733;box-shadow:0 12px 34px rgba(0,0,0,0.15);">
      <div style="font-weight:800;font-size:16px;margin-bottom:10px;">Something went wrong loading the app</div>
      <div style="font-size:13.5px;color:#b91c1c;margin-bottom:14px;">${esc(err && err.message ? err.message : String(err))}</div>
      <div style="font-size:13px;color:#5b6b7a;">Try reopening this file directly in a browser (Chrome, Safari, or Edge) rather than a document previewer, then reload the page.</div>
    </div></div>`;
}
(async function init(){
  try{
    await loadState(); render();
    const cfg = await loadSyncConfig();
    if(cfg){ initSync(cfg, true); }
    else if(BAKED_SYNC_CONFIG){ initSync(BAKED_SYNC_CONFIG, true); }
  }
  catch(err){ showFatalError(err); }
})();
// Register the service worker for offline support and installability.
// Only works when served over https:// (e.g. via Netlify) — silently does
// nothing if opened as a local file, so this never breaks anything.
if('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* not critical */ });
  });
}
</script>
