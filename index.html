<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#374151">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ESFRMS">
<title>Excellent Stars Foundation International School — Result Management System</title>
<style>
  :root{
    --navy:#374151;
    --navy-2:#4b5563;
    --navy-3:#6b7280;
    --blue:#9ca3af;
    --green:#16a34a;
    --green-2:#15803d;
    --green-light:#22c55e;
    --bg:#eef1ee;
    --card:#ffffff;
    --text:#1f2937;
    --text-dim:#5b6472;
    --text-faint:#8b93a1;
    --border:#e3e6ea;
    --border-strong:#cdd2d8;
    --danger:#dc2626;
    --gold:#d4af37;
    --gold-2:#b8952c;
    --shadow: 0 4px 18px rgba(55,65,81,0.09);
    --shadow-lg: 0 12px 34px rgba(55,65,81,0.2);
    --font-display: Georgia, 'Times New Roman', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:linear-gradient(160deg, #eef1ee 0%, #e7ede8 45%, #eef1ee 100%);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
  #app{min-height:100vh;display:flex;flex-direction:column;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px;}

  /* ================= LOGIN ================= */
  .login-page{min-height:100vh;display:flex;flex-direction:column;background:
      linear-gradient(180deg, #eaf1ec 0%, #f2f5f1 55%, #ffffff 100%);position:relative;overflow:hidden;}

  .login-shell{display:flex;flex-direction:column;flex:1;}
  @media (min-width:900px){ .login-shell{flex-direction:row;} }

  .login-brand-panel{
    background:linear-gradient(165deg, var(--navy) 0%, var(--navy-2) 55%, var(--navy) 100%);
    color:#fff;padding:26px 22px 22px 22px;text-align:center;position:relative;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  }
  @media (min-width:900px){ .login-brand-panel{width:44%;padding:40px 34px;} }
  .brand-crest-badge{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,0.08);border:2px solid rgba(255,255,255,0.25);display:flex;align-items:center;justify-content:center;padding:10px;}
  .brand-crest-badge img{width:100%;height:100%;object-fit:contain;}
  .brand-panel-title{font-family:var(--font-display);font-weight:800;font-size:19px;line-height:1.35;margin-top:4px;}
  .brand-gold-divider{display:flex;align-items:center;gap:10px;color:var(--gold);width:100%;max-width:220px;margin:2px 0;font-size:13px;}
  .brand-gold-divider::before,.brand-gold-divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.28);}
  .brand-panel-sub{font-size:11px;letter-spacing:1.6px;font-weight:700;color:#dbe8dd;text-transform:uppercase;}
  .brand-illustration{display:flex;gap:12px;align-items:center;justify-content:center;margin:14px 0;}
  .brand-illustration .ill-icon{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.18);display:flex;align-items:center;justify-content:center;}
  .brand-illustration .ill-icon svg{width:24px;height:24px;color:#fff;}
  .brand-footer-tagline{font-size:13px;color:#eaf3ec;margin-top:6px;}
  .brand-footer-tagline b{color:var(--gold);border-bottom:2px solid var(--gold);padding-bottom:2px;}

  .login-form-panel{flex:1;display:flex;align-items:center;justify-content:center;padding:22px 16px 30px 16px;}
  .login-form-inner{width:100%;max-width:420px;}
  .secure-badge-row{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--green-2);margin-bottom:4px;}
  .secure-badge-row svg{width:15px;height:15px;}
  .secure-badge-sub{text-align:center;font-size:11.5px;color:var(--text-faint);margin-bottom:14px;}
  .welcome-heading{font-size:21px;font-weight:800;color:var(--text);text-align:center;}
  .welcome-heading .accent{color:var(--green-2);}
  .gold-star-divider{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--gold);margin:8px 0 16px 0;}
  .gold-star-divider::before,.gold-star-divider::after{content:'';width:32px;height:1px;background:var(--border-strong);}
  .btn-google{width:100%;padding:11px 14px;border-radius:11px;border:1.5px solid var(--border-strong);background:#fff;color:var(--text);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap;}
  .btn-google svg{width:19px;height:19px;flex-shrink:0;}
  .btn-google:hover{background:#f7f9f8;}
  .btn-google:disabled{opacity:0.6;cursor:default;}

  .login-topbar{display:flex;justify-content:space-between;align-items:flex-start;padding:5px 20px;font-size:12.5px;color:var(--navy-2);flex-wrap:wrap;gap:8px;position:relative;z-index:2;}
  .login-topbar .contact-item{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-weight:600;}
  .login-topbar svg{width:14px;height:14px;flex-shrink:0;}
  .login-tagline{font-style:italic;color:var(--green-2);font-size:14px;text-align:right;line-height:1.3;font-weight:600;}

  .building-decor{position:absolute;bottom:0;left:0;right:0;height:38%;z-index:0;opacity:0.85;pointer-events:none;}
  .stripe-band{position:absolute;bottom:0;left:0;right:0;height:60px;
    background:linear-gradient(100deg, var(--navy) 0%, var(--navy-3) 45%, var(--green) 75%, var(--green-light) 100%);
    clip-path: polygon(0 40%, 100% 0%, 100% 100%, 0% 100%);z-index:1;}

  .login-center{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 18px 16px 18px;position:relative;z-index:2;}
  .login-inner{width:100%;max-width:460px;text-align:center;}
  .crest-wrap{margin-bottom:4px;}
  .crest-wrap img{width:74px;height:74px;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(15,42,84,0.25));}
  .brand-title{font-family:var(--font-display);font-weight:800;font-size:19px;line-height:1.25;margin:4px 0 2px 0;}
  .brand-title .navy{color:var(--navy);}
  .brand-title .green{color:var(--green-2);}
  .brand-sub{color:var(--text-dim);font-size:10.5px;letter-spacing:1.2px;font-weight:700;text-transform:uppercase;margin-bottom:12px;}
  .brand-sub .accent{color:var(--green-2);}

  .auth-card{background:var(--card);border-radius:18px;box-shadow:var(--shadow-lg);padding:14px 18px;text-align:left;}
  .auth-card-head{text-align:center;margin-bottom:10px;}
  .auth-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg, var(--navy-3), var(--green));display:flex;align-items:center;justify-content:center;margin:0 auto 8px auto;}
  .auth-avatar svg{width:24px;height:24px;color:#fff;}
  .auth-heading{display:flex;align-items:center;justify-content:center;gap:10px;font-size:19px;font-weight:800;color:var(--navy);}
  .auth-heading svg{width:16px;height:16px;color:var(--green-2);}
  .auth-welcome{color:var(--text-dim);font-size:13.5px;margin-top:4px;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:11.5px;font-weight:700;color:var(--navy);margin-bottom:6px;letter-spacing:0.3px;}
  .input-icon-wrap{position:relative;}
  .input-icon-wrap svg.left-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--green-2);}
  .input-icon-wrap input{width:100%;padding:12px 13px 12px 40px;border:1.5px solid var(--border);border-radius:10px;font-size:14.5px;background:#f8fafc;outline:none;color:var(--text);}
  .input-icon-wrap input:focus{border-color:var(--green);background:#fff;}
  .eye-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-faint);padding:4px;}
  .eye-toggle svg{width:18px;height:18px;}
  .remember-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:13px;}
  .remember-row label{display:flex;align-items:center;gap:7px;color:var(--text-dim);font-weight:600;}
  .remember-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--green);}
  .forgot-link{color:var(--green-2);font-weight:700;background:none;border:none;font-size:13px;}
  .btn-login{
    width:100%;padding:14px;border:none;border-radius:11px;
    background:linear-gradient(90deg, var(--navy-3), var(--green));
    color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 8px 18px rgba(22,163,74,0.28);
  }
  .btn-login:hover{filter:brightness(1.05);}
  .btn-login svg{width:18px;height:18px;}
  .divider-row{display:flex;align-items:center;gap:12px;margin:10px 0;color:var(--text-faint);font-size:11.5px;font-weight:700;}
  .divider-row::before,.divider-row::after{content:'';flex:1;height:1px;background:var(--border);}
  .secure-row{display:flex;justify-content:center;gap:18px;color:var(--text-dim);font-size:12.5px;font-weight:600;margin-bottom:4px;}
  .secure-row span{display:flex;align-items:center;gap:5px;}
  .secure-row svg{width:14px;height:14px;color:var(--green-2);}

  .feature-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px;}
  .feature-item{background:var(--card);border-radius:10px;padding:8px 3px;box-shadow:var(--shadow);text-align:center;}
  .feature-item svg{width:16px;height:16px;color:var(--navy-3);margin-bottom:4px;}
  .feature-item div{font-size:9.5px;font-weight:700;color:var(--text-dim);line-height:1.25;}

  .login-footer{position:relative;z-index:2;background:linear-gradient(90deg,var(--navy),var(--navy-3) 60%, var(--green-2));color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;font-size:11.5px;flex-wrap:wrap;gap:14px;}
  .login-footer .lf-left{display:flex;align-items:center;gap:8px;font-weight:700;}
  .login-footer .lf-left svg{width:16px;height:16px;color:var(--green-light);flex-shrink:0;}
  .login-footer .lf-left-sub{font-weight:400;opacity:0.75;font-size:10.5px;margin-top:1px;}
  .login-footer .lf-mid{opacity:0.9;display:flex;flex-direction:column;gap:3px;}
  .login-footer .lf-mid-item{display:flex;align-items:center;gap:6px;}
  .login-footer .lf-mid-item svg{width:12px;height:12px;flex-shrink:0;}
  .login-footer .lf-right{display:flex;align-items:center;gap:8px;text-align:right;}
  .login-footer .lf-right svg{width:20px;height:20px;color:var(--gold);flex-shrink:0;}
  .login-footer .lf-right b{color:var(--gold);}
  .version-pill{background:rgba(255,255,255,0.18);padding:4px 12px;border-radius:999px;font-weight:700;}

  .form-error{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:10px 12px;border-radius:9px;font-size:13px;margin-bottom:14px;}
  .form-hint{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;padding:10px 12px;border-radius:9px;font-size:13px;margin-bottom:14px;}
  .link-back{display:inline-flex;align-items:center;gap:6px;color:var(--navy-3);font-weight:700;font-size:13.5px;background:none;border:none;margin-bottom:14px;}
  .link-back svg{width:15px;height:15px;}

  /* ================= APP SHELL ================= */
  .shell{display:flex;flex:1;min-height:100vh;position:relative;}
  .sidebar{width:270px;flex-shrink:0;background:linear-gradient(180deg, var(--navy), var(--navy-2) 70%);color:#eaf1fb;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .sidebar-header{padding:24px 20px 16px 20px;border-bottom:1px solid rgba(255,255,255,0.12);position:relative;text-align:center;}
  .sidebar-close{position:absolute;top:14px;right:14px;background:none;border:none;color:#cfe0f5;font-size:18px;display:none;}
  .sidebar-crest{width:52px;height:52px;margin:0 auto 10px auto;}
  .sidebar-crest img{width:100%;height:100%;object-fit:contain;}
  .sidebar-school{font-family:var(--font-display);font-weight:700;font-size:15.5px;line-height:1.3;}
  .sidebar-tag{color:#8fd6a8;font-size:9.5px;letter-spacing:1.2px;font-weight:700;text-transform:uppercase;margin-top:6px;}
  .sidebar-role-badge{display:inline-block;margin-top:10px;background:rgba(34,197,94,0.22);color:#8fd6a8;font-size:10px;font-weight:800;padding:3px 10px;border-radius:999px;letter-spacing:0.5px;}
  .menu-label{padding:16px 20px 6px 20px;font-size:10.5px;letter-spacing:1.4px;color:#7f97b5;text-transform:uppercase;font-weight:700;}
  .menu-item{display:flex;align-items:center;gap:13px;padding:12px 20px;margin:2px 10px;border-radius:10px;color:#cfe0f5;font-weight:600;font-size:14.5px;border:none;background:transparent;width:calc(100% - 20px);text-align:left;transition:background .15s ease, color .15s ease;}
  .menu-item svg{width:18px;height:18px;flex-shrink:0;opacity:0.9;}
  .menu-item:hover{background:rgba(255,255,255,0.08);color:#fff;}
  .menu-item.active{background:linear-gradient(90deg, rgba(37,99,235,0.35), rgba(22,163,74,0.35));color:#fff;}
  .sidebar-footer{margin-top:auto;padding:14px 20px 20px 20px;border-top:1px solid rgba(255,255,255,0.12);}
  .admin-row{display:flex;align-items:center;gap:11px;padding:8px 0;}
  .admin-avatar{width:36px;height:36px;border-radius:9px;background:var(--green);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex-shrink:0;}
  .admin-name{font-weight:700;font-size:13.5px;color:#fff;}
  .admin-email{font-size:11.5px;color:#9db8d6;}
  .signout-btn{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;color:#cfe0f5;padding:11px 3px 0 3px;font-size:13.5px;font-weight:700;}
  .signout-btn:hover{color:#fca5a5;}
  .signout-btn svg{width:16px;height:16px;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:16px 24px;background:#fff;border-bottom:1px solid var(--border);box-shadow:0 1px 0 rgba(15,42,84,0.03);}
  .hamburger{background:none;border:none;color:var(--navy);display:none;}
  .hamburger svg{width:23px;height:23px;}
  .page-title{font-size:19px;font-weight:800;font-family:var(--font-display);color:var(--navy);}
  .content{padding:22px;max-width:1100px;width:100%;margin:0 auto;flex:1;}
  .overlay{display:none;position:fixed;inset:0;background:rgba(15,42,84,0.4);z-index:8;}

  /* ================= Cards ================= */
  .hero-card{background:linear-gradient(120deg, var(--navy) 0%, var(--navy-3) 55%, var(--green-2) 100%);border-radius:18px;padding:34px 24px;text-align:center;margin-bottom:20px;color:#fff;box-shadow:var(--shadow-lg);}
  .hero-crest{width:64px;height:64px;margin:0 auto 14px auto;}
  .hero-crest img{width:100%;height:100%;object-fit:contain;}
  .hero-eyebrow{color:#a8e6bd;letter-spacing:2.2px;font-size:11px;font-weight:700;margin-bottom:8px;}
  .hero-title{font-family:var(--font-display);font-size:23px;font-weight:700;margin:0 0 12px 0;line-height:1.3;}
  .hero-desc{color:#e3ecf9;font-size:14px;max-width:520px;margin:0 auto;line-height:1.6;}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:20px;}
  .stat-card{background:var(--card);border-radius:14px;padding:18px 16px;box-shadow:var(--shadow);}
  .stat-icon{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
  .stat-icon svg{width:19px;height:19px;color:#fff;}
  .icon-blue{background:linear-gradient(135deg, var(--navy-3), var(--blue));}
  .icon-green{background:linear-gradient(135deg, var(--green), var(--green-2));}
  .icon-navy{background:linear-gradient(135deg, var(--navy), var(--navy-2));}
  .stat-value{font-size:25px;font-weight:800;color:var(--navy);}
  .stat-label{color:var(--text-dim);font-size:13px;font-weight:600;margin-top:2px;}

  .card{background:var(--card);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:var(--shadow);transition:box-shadow .2s ease;}
  .card-title{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15.5px;margin-bottom:4px;color:var(--navy);}
  .card-title svg{width:18px;height:18px;color:var(--green-2);}
  .card-sub{color:var(--text-dim);font-size:13px;margin-bottom:16px;}
  .empty-box{border:1.5px dashed var(--border-strong);border-radius:12px;padding:32px 16px;text-align:center;background:#fafcfd;}
  .empty-title{font-weight:800;font-size:15px;margin-bottom:6px;color:var(--navy);}
  .empty-sub{color:var(--text-dim);font-size:13px;}
  .link-btn{background:none;border:none;color:var(--green-2);font-weight:700;font-size:13px;}

  .grading-row{display:flex;justify-content:space-between;padding:9px 0;font-size:14px;color:var(--text);}
  .grading-row.total{border-top:1px solid var(--border);margin-top:6px;padding-top:13px;font-weight:800;}
  .grading-row .amt{color:var(--green-2);font-weight:700;}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
  .photo-row{display:flex;align-items:center;gap:15px;margin-bottom:16px;}
  .photo-circle{width:68px;height:68px;border-radius:14px;border:1.5px solid var(--border);background:#f4f7fa;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
  .photo-circle img{width:100%;height:100%;object-fit:cover;}
  .photo-circle svg{width:28px;height:28px;color:var(--green-2);}
  .upload-btn{background:var(--green);color:#fff;border:none;border-radius:9px;padding:10px 15px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:7px;}
  .search-box{position:relative;margin-bottom:13px;}
  .search-box svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-faint);}
  .search-box input{width:100%;padding:11px 13px 11px 38px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;background:#f8fafc;outline:none;color:var(--text);}
  .search-box input:focus{border-color:var(--green);}

  .field input, .field select, .field textarea{width:100%;background:#f8fafc;border:1.5px solid var(--border);color:var(--text);padding:11px 12px;border-radius:10px;font-size:14.5px;outline:none;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--green);background:#fff;}
  .field input::placeholder,.field textarea::placeholder{color:#a3b1bd;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:9px;padding:10px 14px;font-weight:700;font-size:13.5px;transition:filter .15s ease, transform .05s ease;}
  .btn svg{width:15px;height:15px;flex-shrink:0;}
  .btn:active{transform:scale(0.99);}
  .btn-block{width:100%;}
  .btn-primary{background:linear-gradient(90deg, var(--navy-3), var(--green));color:#fff;box-shadow:0 6px 14px rgba(22,163,74,0.22);}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:#fff;border:1.5px solid var(--border-strong);color:var(--navy);}
  .btn-ghost:hover{background:#f4f7fa;}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-sm{padding:8px 12px;font-size:12.5px;border-radius:8px;}
  @media (min-width: 640px){
    .card .btn-block{ max-width:340px; margin-left:auto; margin-right:auto; }
    .card .grid-2 .btn-block{ max-width:none; }
  }

  .list-row{display:flex;align-items:center;gap:12px;padding:12px 12px;border-radius:12px;border:1.5px solid var(--border);margin-bottom:9px;background:#fbfdfe;}
  .list-row:hover{border-color:var(--border-strong);}
  .list-row.clickable{cursor:pointer;}
  .list-row.selected{border-color:var(--green);background:#f0fdf4;}
  .row-avatar{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg, var(--navy-3), var(--green));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;overflow:hidden;font-size:13px;}
  .row-avatar img{width:100%;height:100%;object-fit:cover;}
  .row-main{flex:1;min-width:0;}
  .row-name{font-weight:700;font-size:14px;color:var(--text);}
  .row-meta{color:var(--text-dim);font-size:12px;margin-top:2px;}
  .row-actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--text-dim);}
  .icon-btn:hover{border-color:var(--border-strong);color:var(--navy);}
  .icon-btn svg{width:15px;height:15px;}
  .badge{display:inline-block;background:#f0fdf4;color:var(--green-2);font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;}
  .badge.navy{background:#eaf1fb;color:var(--navy-3);}

  .score-table{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed;}
  .score-table th{text-align:left;color:var(--green-2);font-size:10.5px;letter-spacing:0.6px;text-transform:uppercase;padding:8px 6px;border-bottom:1.5px solid var(--border);}
  .score-table th:first-child, .score-table td.subj-name{width:34%;}
  .score-table td{padding:7px 4px;border-bottom:1px solid var(--border);vertical-align:middle;}
  .score-table input{width:100%;max-width:42px;background:#f8fafc;border:1.5px solid var(--border);color:var(--text);padding:7px 3px;border-radius:7px;font-size:12.5px;text-align:center;}
  .score-table input:focus{border-color:var(--green);background:#fff;}
  .score-table .subj-name{font-weight:600;color:var(--text);line-height:1.25;overflow-wrap:break-word;}
  .score-table .total-cell{font-weight:800;color:var(--green-2);}

  .bar-row{margin-bottom:13px;}
  .bar-row-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:var(--text);}
  .bar-track{height:9px;border-radius:5px;background:#e7edf2;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg, var(--navy-3), var(--green));border-radius:5px;}

  .chip{padding:7px 12px;border-radius:999px;border:1.5px solid var(--border-strong);background:#fff;color:var(--text-dim);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
  .chip.active{background:var(--green);color:#fff;border-color:var(--green);}
  .toggle-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}

  /* ================= Report card (hardcopy-style Report Sheet) ================= */
  .report-sheet{background:#fff;color:#111;border-radius:10px;padding:26px 28px;max-width:980px;margin:0 auto;position:relative;overflow:hidden;font-size:11.5px;}
  .report-watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0.055;pointer-events:none;z-index:0;}
  .report-watermark img{width:60%;max-width:340px;}
  .report-sheet > *:not(.report-watermark){position:relative;z-index:1;}
  .report-serial{position:absolute;top:14px;right:18px;font-family:var(--font-display);font-weight:700;font-size:15px;color:#333;z-index:2;}
  .report-photo{position:absolute;top:18px;right:20px;width:60px;height:70px;border:1px solid #ccc;border-radius:4px;overflow:hidden;z-index:2;background:#fff;}
  .report-photo img{width:100%;height:100%;object-fit:cover;}
  .report-head{text-align:center;border-bottom:3px double var(--navy);padding-bottom:10px;margin-bottom:10px;}
  .report-head-row{display:flex;align-items:center;justify-content:center;gap:14px;}
  .report-crest{width:56px;height:56px;flex-shrink:0;}
  .report-crest img{width:100%;height:100%;object-fit:contain;}
  .report-crest-center{width:52px;height:52px;margin:0 auto 6px auto;}
  .report-crest-center img{width:100%;height:100%;object-fit:contain;}
  .report-head-text{text-align:center;}
  .report-school{font-family:var(--font-display);font-weight:800;font-size:27px;margin:0 0 3px 0;color:var(--green-2);text-transform:uppercase;letter-spacing:0.4px;line-height:1.15;}
  .report-addr{font-size:12px;color:#333;line-height:1.4;text-transform:uppercase;}
  .report-contact{font-size:11.5px;color:#333;margin-top:2px;text-transform:uppercase;}
  .report-motto-pill{display:inline-block;margin-top:7px;background:var(--green);color:#fff;font-weight:700;font-size:12px;padding:4px 14px;border-radius:999px;letter-spacing:0.4px;text-transform:uppercase;}
  .report-title{margin-top:10px;font-family:var(--font-display);font-weight:800;font-size:26px;color:var(--green-2);text-transform:uppercase;letter-spacing:1.5px;}

  .rs-topbox{width:220px;margin:8px 0 10px auto;border-collapse:collapse;font-size:10px;}
  .rs-topbox td{border:1px solid #999;padding:3px 6px;}
  .rs-topbox td.rs-topbox-label{font-weight:700;background:#f3f4f6;width:60%;}

  .rs-bio{font-size:11.5px;margin-bottom:8px;border-top:1px solid #999;padding-top:8px;}
  .rs-bio-row{display:flex;flex-wrap:wrap;gap:4px 18px;margin-bottom:5px;border-bottom:1px dotted #bbb;padding-bottom:5px;}
  .rs-bio-row span{color:#555;font-weight:700;margin-right:3px;}
  .rs-bio-row b{font-weight:600;color:#111;}

  .rs-section{margin-top:8px;}

  .rs-main{display:flex;gap:14px;align-items:stretch;}
  .rs-academic-wrap{flex:1.7;min-width:0;display:flex;}
  .rs-academic-col{flex:1;min-width:0;width:100%;display:flex;flex-direction:column;gap:8px;}
  /* Academic table grows to fill the column so its bottom meets the grade-scale
     table with no blank gap, and the whole left column matches the height of the
     Skills/Behaviour/Key column beside it. */
  .rs-academic-col .rs-academic{flex:1 1 auto;height:100%;}
  .rs-academic-col .rs-scale-table{flex:0 0 auto;}
  .rs-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}

  .rs-academic{width:100%;table-layout:fixed;border-collapse:collapse;font-size:var(--rs-font,10.8px);}
  .rs-academic th,.rs-academic td{border:1px solid #999;padding:var(--rs-pad-y,11px) 5px;text-align:center;overflow-wrap:break-word;word-break:break-word;}
  .rs-academic th{background:var(--navy);color:#fff;font-size:9px;text-transform:uppercase;letter-spacing:0.2px;}
  .rs-academic td.rs-subj{text-align:left;font-weight:600;overflow-wrap:normal;word-break:normal;white-space:normal;hyphens:none;}
  .rs-academic td.rs-grade{font-weight:700;}
  .rs-academic input.rs-remark-input{width:100%;border:none;background:transparent;font-size:var(--rs-font, 10px);font-family:inherit;line-height:1.15;text-align:left;padding:0;}
  .rs-academic input.rs-remark-input:focus{outline:none;background:#fffbea;}

  .rating-block{border:1px solid #999;border-radius:2px;}
  .rating-title{background:var(--navy);color:#fff;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;padding:3px 6px;}
  .rating-table{width:100%;border-collapse:collapse;font-size:8.7px;table-layout:fixed;}
  .rating-table th,.rating-table td{border:1px solid #ccc;padding:3px;text-align:center;width:8%;}
  .rating-table th:first-child, .rating-table td.trait-name{width:60%;}
  .rating-table td.trait-name{text-align:left;white-space:nowrap;font-weight:500;padding-left:8px;}
  .rate-dot{width:16px;height:16px;border-radius:50%;border:1px solid #999;background:#fff;padding:0;cursor:pointer;font-size:11px;line-height:1;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:inherit;}
  .rate-dot.active{background:var(--green);border-color:var(--green-2);font-weight:800;}

  .rs-key-box{border:1px solid #999;border-radius:2px;padding:6px 8px;font-size:8.5px;line-height:1.45;color:#333;}
  .rs-key-box .rs-key-title{font-weight:700;text-align:center;margin-bottom:3px;text-decoration:underline;}
  .rs-scale-table{width:100%;border-collapse:collapse;font-size:10px;}
  .rs-scale-table th,.rs-scale-table td{border:1px solid #999;padding:5px 6px;text-align:center;}
  .rs-scale-table th{background:var(--navy);color:#fff;}

  .rs-attendance{margin-top:10px;border:1px solid #999;border-radius:2px;padding:8px 10px;}
  .rs-attendance-title{color:var(--green-2);font-weight:700;font-size:11px;margin-bottom:6px;}
  .rs-attendance-grid{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:10.5px;}
  .rs-attendance-grid label{display:flex;align-items:center;gap:6px;}

  .rs-bottom{margin-top:10px;font-size:11px;}
  .rs-bottom-row{display:flex;align-items:flex-end;gap:8px;margin-bottom:14px;}
  .rs-bottom-row span{font-weight:700;white-space:nowrap;}
  .rs-bottom-row input{flex:1;border:none;border-bottom:1px dotted #999;background:transparent;font-size:11px;font-family:inherit;padding:2px 4px;}
  .rs-bottom-row input:focus{outline:none;border-bottom-color:var(--green);}
  .rs-sign-line{display:flex;justify-content:flex-end;gap:26px;margin-top:2px;font-size:9.5px;color:#666;}
  .rs-sign-line .sign-slot{border-top:1px solid #999;padding-top:3px;width:150px;text-align:center;}

  .rs-bottom-cols{display:flex;gap:16px;align-items:stretch;}
  .rs-bottom-col{flex:1;min-width:0;display:flex;flex-direction:column;}
  .rs-bottom-col-label{font-weight:700;white-space:nowrap;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;gap:6px;}
  .rs-bottom-col-label .auto-remark-btn{font-size:8.5px;font-weight:700;border:1px solid var(--green-2);color:var(--green-2);background:#f2fbf4;border-radius:999px;padding:2px 8px;white-space:nowrap;}
  .rs-bottom-col-label .auto-remark-btn:hover{background:var(--green-2);color:#fff;}
  .rs-bottom-col input{width:100%;border:none;border-bottom:1px dotted #999;background:transparent;font-size:10.5px;font-family:inherit;padding:2px 4px;}
  .rs-bottom-col input:focus{outline:none;border-bottom-color:var(--green);}
  .rs-bottom-col .sign-img{align-self:center;margin:2px 0 0 0;}
  .rs-sign-space{height:30px;display:flex;align-items:flex-end;justify-content:center;}
  .rs-bottom-col .sign-slot{border-top:1px solid #999;padding-top:3px;width:fit-content;min-width:90px;max-width:100%;margin:0 auto;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  @media print{ .rs-bottom-col-label .auto-remark-btn{ display:none !important; } }

  .report-inline-input{border:none;border-bottom:1px solid #999;background:transparent;font-size:11px;font-family:inherit;color:#222;padding:1px 3px;width:70px;}
  .report-inline-input:focus{outline:none;border-bottom-color:var(--green);}
  .sign-img{object-fit:contain;vertical-align:middle;margin-left:8px;}

  @media print{
    @page{ margin: 5mm; }
    html,body{ height:auto; }
    .sidebar, .topbar, .overlay, .footer-note{ display:none !important; }
    #content > *:not(.report-print-area){ display:none !important; }
    .content{ padding:0 !important; max-width:100% !important; }
    .report-print-area{ margin:0 !important; box-shadow:none !important; }
    .report-sheet{ position:relative; margin:0 auto; padding:4mm 6mm; border-radius:0; box-shadow:none; max-width:100%; font-size:9.5px; }
    .report-head{ padding-bottom:4px; margin-bottom:4px; page-break-inside:avoid; break-inside:avoid; }
    .report-crest{ width:44px; height:44px; }
    .report-crest-center{ width:38px; height:38px; margin-bottom:3px; }
    .report-title{ font-size:19px; margin-top:4px; }
    .report-school{ font-size:18px; }
    .report-addr,.report-contact{ font-size:9px; }
    .report-motto-pill{ font-size:9px; padding:2px 10px; margin-top:2px; }
    .rs-topbox{ margin:3px 0 5px auto; font-size:8.5px; }
    .rs-topbox td{ padding:1.5px 5px; }
    .rs-bio{ font-size:9.2px; margin-bottom:3px; padding-top:3px; }
    .rs-bio-row{ margin-bottom:1.5px; padding-bottom:1.5px; gap:3px 14px; }

    .rs-academic{ font-size:var(--rs-font-print,9.8px); }
    .rs-academic th{ font-size:min(9px, var(--rs-font-print, 9px)); }
    .rs-academic th,.rs-academic td{ padding:var(--rs-pad-y-print,10px) 4px; }
    .rs-academic input.rs-remark-input{ font-size:var(--rs-font-print, 9px); line-height:1.1; }
    .rate-dot{ width:9px; height:9px; font-size:7px; }
    .rating-block{ page-break-inside:avoid; break-inside:avoid; }
    .rating-title{ font-size:7px; padding:1px 5px; }
    .rating-table{ font-size:6.5px; }
    .rating-table th,.rating-table td{ padding:0.8px 2px; }
    .rs-key-box{ font-size:7px; padding:3px 6px; line-height:1.3; }
    .rs-scale-table{ font-size:8px; }
    .rs-section{ margin-top:4px; }
    .rs-scale-table th,.rs-scale-table td{ padding:2px 5px; }

    /* Two-column layout via CSS table display: this is rendered consistently
       by the phone's "Save as PDF" engine (unlike flexbox+gap, which was
       mis-measuring and causing the columns to overlap), and table-cells
       automatically stretch to match each other's height, so the shorter
       column never leaves a blank gap next to the taller one. */
    .rs-main{ display:table; width:100%; table-layout:fixed; border-spacing:10px 0; margin:0 -10px; }
    .rs-academic-wrap{ display:table-cell; vertical-align:top; width:64%; height:100%; }
    .rs-side{ display:table-cell; vertical-align:top; width:36%; }
    /* Fill the full cell height so the score table stretches down to the grade
       scale and both columns end level (no gap above Attendance). */
    .rs-academic-col{ height:100%; }
    .rs-academic-col, .rs-side{ gap:4px; }
    .rs-attendance{ margin-top:4px; padding:3px 8px; page-break-inside:avoid; break-inside:avoid; }
    .rs-attendance-title{ font-size:9px; margin-bottom:2px; }
    .rs-attendance-grid{ font-size:8.5px; gap:2px 16px; }
    .rs-attendance-note{ display:none !important; }
    .rs-bottom{ margin-top:4px; font-size:9px; page-break-inside:avoid; break-inside:avoid; }
    .rs-bottom-cols{ gap:10px; }
    .rs-sign-space{ height:22px; }
  }

  #toast-zone{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .toast{background:var(--navy);border:1px solid var(--green);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.25);animation:toastIn .18s ease;}
  .toast.error{border-color:var(--danger);background:#7f1d1d;}
  @keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .modal-overlay{position:fixed;inset:0;background:rgba(15,42,84,0.45);z-index:70;display:flex;align-items:center;justify-content:center;padding:20px;}
  .modal-box{background:#fff;border-radius:14px;padding:22px;max-width:380px;width:100%;box-shadow:var(--shadow-lg);}
  .modal-msg{font-size:14.5px;margin-bottom:20px;line-height:1.5;color:var(--text);}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;}

  .footer-note{text-align:center;color:var(--text-faint);font-size:12px;padding:16px 0 24px 0;}

  @media (max-width: 880px){ .stat-grid{grid-template-columns:1fr 1fr;} .grid-2{grid-template-columns:1fr;} .feature-row{grid-template-columns:repeat(3,1fr);} }
  @media (max-width: 760px){
    .sidebar{position:fixed;left:0;top:0;z-index:20;transform:translateX(-100%);transition:transform .2s ease;}
    .sidebar.open{transform:translateX(0);}
    .sidebar-close{display:block;}
    .hamburger{display:block;}
    .overlay.show{display:block;}
    .content{padding:15px;}
    .report-sheet{padding:18px;}
    .report-info{grid-template-columns:1fr;}
    .login-topbar{flex-direction:column;align-items:center;text-align:center;}
    .login-tagline{text-align:center;}
    .feature-row{grid-template-columns:repeat(3,1fr);}
  }
</style>
</head>

/* ============================= PERSISTENCE ============================= */
// Signature photos come straight from a phone camera/gallery and can be
// several MB as a raw base64 data URL — comfortably over Firestore's ~1MB
// per-document limit once combined with the rest of a user/settings record.
// When that save silently failed, the next sync snapshot would overwrite the
// in-memory change with the old (pre-signature) server copy, making the
// signature appear to "disappear" even though nothing was wrong with the
// upload itself. Downscaling + re-encoding every signature before it's
// stored fixes that at the source.
function compressSignatureImage(dataUrl, maxDim=360, quality=0.82){
  return new Promise((resolve)=>{
    try{
      const img = new Image();
      img.onload = ()=>{
        try{
          let w = img.width, h = img.height;
          if(w<=0||h<=0){ resolve(dataUrl); return; }
          const scale = Math.min(1, maxDim / Math.max(w,h));
          w = Math.max(1, Math.round(w*scale)); h = Math.max(1, Math.round(h*scale));
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0,0,w,h); // flatten transparency so JPEG encoding stays clean
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        }catch(e){ resolve(dataUrl); }
      };
      img.onerror = ()=>resolve(dataUrl);
      img.src = dataUrl;
    }catch(e){ resolve(dataUrl); }
  });
}
async function storageGet(key){
  if(typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function'){
    try{ const res = await window.storage.get(key, false); return res ? res.value : null; }catch(e){}
  }
  try{ if(typeof localStorage !== 'undefined'){ return localStorage.getItem(key); } }catch(e){}
  return _memoryFallback;
}
async function storageSet(key, value){
  let saved = false;
  if(typeof window.storage !== 'undefined' && window.storage && typeof window.storage.set === 'function'){
    try{ await window.storage.set(key, value, false); saved = true; }catch(e){}
  }
  if(!saved){ try{ if(typeof localStorage !== 'undefined'){ localStorage.setItem(key, value); saved = true; } }catch(e){} }
  if(!saved){ _memoryFallback = value; }
  return saved;
}
async function loadState(){

    const raw = await storageGet(STORAGE_KEY);

        sidebarOpen:false, authMode:'signin', authError:'', authNotice:'', showPassword:false
      });
      state.settings = Object.assign(defaultState().settings, parsed.settings||{});
      if(!parsed.users || parsed.users.length===0) state.users = defaultState().users;

      // Senior Secondary level — clear this on every other level (JSS, Clubs &

      state.settings.classGroups.forEach(g=>{ if(g.key!=='sss' && g.departmentsEnabled){ g.departmentsEnabled = false; } });
      state.students.forEach(s=>{ if(s.department && !departmentsEnabledForClass(s.class)){ s.department = null; } });
    }
  }catch(e){}
}

/* ============================= MULTI-DEVICE SYNC (FIRESTORE) =============================
   Optional layer. When not configured, the app behaves exactly as a purely offline app
   (nothing below ever runs). When configured, students/scores/remarks/users/settings are
   mirrored to Firestore, which itself caches locally and syncs automatically the moment
   the device is back online — so score entry still works with zero internet, and just
   quietly catches up with everyone else's changes once connected. */
const SYNC_CONFIG_KEY = 'esfrms_sync_config_v1';
let fb = { enabled:false, connecting:false, status:'off', app:null, db:null, unsubs:[], lastError:'', lastRawInput:'', remoteVersion:null, remoteHtml:null, remoteNotes:'', updateDismissed:false, currentConfig:null, reconnectAttempts:0, reconnectTimer:null };

function loadFirebaseScripts(){
  return new Promise((resolve, reject)=>{
    if(window.firebase && window.firebase.firestore){ resolve(); return; }
    const urls = [
      'https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js',
      'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js',
      'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js',
    ];
    let i = 0;
    function next(){
      if(i>=urls.length){ resolve(); return; }
      const s = document.createElement('script');
      s.src = urls[i];
      s.onload = ()=>{ i++; next(); };
      s.onerror = ()=>reject(new Error('Could not load Firebase — check your internet connection.'));
      document.head.appendChild(s);
    }
    next();
  });
}

async function loadSyncConfig(){
  try{ const raw = await storageGet(SYNC_CONFIG_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
async function saveSyncConfig(cfg){ try{ await storageSet(SYNC_CONFIG_KEY, JSON.stringify(cfg)); }catch(e){} }
async function clearSyncConfig(){ try{ await storageSet(SYNC_CONFIG_KEY, ''); }catch(e){} }

function withTimeout(promise, ms, message){
  return Promise.race([
    promise,
    new Promise((_, reject)=>setTimeout(()=>reject(new Error(message)), ms))
  ]);
}
function translateFirebaseError(e){
  const code = e && e.code ? e.code : '';
  const map = {
    'auth/operation-not-allowed': 'Anonymous sign-in isn\'t enabled on your Firebase project yet. Go to Firebase Console → Build → Authentication → Sign-in method → enable "Anonymous", then try again.',
    'auth/api-key-not-valid': 'That apiKey isn\'t valid — double-check you copied it exactly, with no missing characters.',
    'auth/invalid-api-key': 'That apiKey isn\'t valid — double-check you copied it exactly, with no missing characters.',
    'auth/project-not-found': 'That projectId doesn\'t match any Firebase project — check you copied the config from the right project.',
    'auth/network-request-failed': 'Your device could not reach Firebase\'s servers — check your internet connection, or try a different network (some mobile data networks block Google\'s auth servers).',
    'permission-denied': 'Connected, but Firestore is rejecting reads/writes — check you published the security rules I gave you (Firestore → Rules → Publish).',
    'unavailable': 'Firebase\'s servers were unreachable — check your internet connection and try again.',
  };
  if(map[code]) return map[code];
  if(e && e.message && /timed out/i.test(e.message)) return e.message;
  return (e && e.message) ? e.message : String(e);
}
// A connection failure used to just sit there in an error state until someone
// noticed the red banner and manually hit "reconnect" — on a school network
// with flaky wifi/mobile data, that meant sync could silently stay broken for
// hours. This retries automatically with backoff (10s, 20s, 40s... capped at
// 2 minutes) using whatever config last worked, until it succeeds.
function scheduleReconnect(){
  if(fb.reconnectTimer) return; // already have one pending
  const attempt = (fb.reconnectAttempts = (fb.reconnectAttempts||0) + 1);
  const delay = Math.min(120000, 10000 * Math.pow(2, attempt-1));
  fb.reconnectTimer = setTimeout(()=>{
    fb.reconnectTimer = null;
    if(fb.currentConfig && !fb.enabled) initSync(fb.currentConfig, true);
  }, delay);
}
async function initSync(cfg, silent, rawText){
  fb.connecting = true; fb.status='connecting'; fb.lastError='';
  fb.currentConfig = cfg;
  fb.reconnectAttempts = fb.reconnectAttempts || 0;
  if(rawText!==undefined) fb.lastRawInput = rawText;
  if(!silent) render();
  try{
    await withTimeout(loadFirebaseScripts(), 20000, 'Timed out loading Firebase\'s scripts — check your internet connection and try again, ideally on WiFi.');
  }catch(e){
    fb.enabled = false; fb.connecting = false; fb.status = 'error';
    fb.lastError = translateFirebaseError(e);
    if(!silent) render();
    scheduleReconnect();
    return false;
  }
  try{
    if(!fb.app){ fb.app = firebase.initializeApp(cfg); } else { fb.app = firebase.apps[0] || firebase.initializeApp(cfg); }
    fb.db = firebase.firestore();
    // Many mobile/corporate networks block the streaming connection Firestore
    // prefers by default (this is exactly the "connects fine, but reads/writes
    // hang" symptom). Long-polling uses plain HTTP requests instead, which get
    // through far more restrictive networks.
    try{ fb.db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); }catch(e){}
    try{ await withTimeout(fb.db.enablePersistence({synchronizeTabs:true}), 6000, 'persistence-timeout'); }catch(e){ /* already enabled, unsupported, or another tab is holding the lock — fine, continues without offline caching rather than hanging forever */ }
  }catch(e){
    fb.enabled = false; fb.connecting = false; fb.status = 'error';
    fb.lastError = 'Could not set up Firestore: '+translateFirebaseError(e);
    if(!silent) render();
    scheduleReconnect();
    return false;
  }
  // Anonymous sign-in is attempted but no longer blocks the connection — some
  // browser/network combinations hang on this step specifically. If it fails,
  // sync still works as long as Firestore rules allow open access (see setup guide).
  try{
    await withTimeout(firebase.auth().signInAnonymously(), 8000, 'auth-skip');
  }catch(e){ /* proceed without auth */ }
  fb.lastRawInput = '';
  // Only claim success once we've actually confirmed a real round-trip to
  // Firestore's servers — not just that the local SDK set up without errors.
  // This is what was misleading before: it showed "Synced" even when no real
  // read or write had ever actually succeeded.
  let seedSnap;
  try{
    seedSnap = await withTimeout(fb.db.collection('students').limit(1).get({source:'server'}), 15000,
      'Connected to Firebase, but could not actually reach Firestore\'s servers to read or write data — your network is likely blocking the connection. Try a different network (WiFi vs mobile data), or a different location.');
  }catch(e){
    fb.enabled = false; fb.connecting = false; fb.status = 'error';
    fb.lastError = translateFirebaseError(e);
    if(!silent) render();
    scheduleReconnect();
    return false;
  }
  fb.enabled = true; fb.status = navigator.onLine===false ? 'offline' : 'online';
  fb.reconnectAttempts = 0;
  if(fb.reconnectTimer){ clearTimeout(fb.reconnectTimer); fb.reconnectTimer = null; }
  // If the cloud is empty but this device already has real data, seed the cloud
  // with it automatically — this is what was missing before: connecting alone
  // never uploaded anything, so every device just connected to an empty database.
  try{
    if(seedSnap.empty && state.students.length>0){
      if(!silent) toast('Uploading this device\'s existing data to the cloud…');
      await repoPushAll();
    }
  }catch(e){ /* not critical — listeners below will still keep things in sync going forward */ }
  attachSyncListeners();
  await saveSyncConfig(cfg);
  fb.connecting = false;
  if(!silent){ toast('Connected — this device will now sync automatically.'); render(); }
  return true;
}
function disconnectSync(){
  fb.unsubs.forEach(u=>{ try{u();}catch(e){} });
  fb.unsubs = [];
  if(fb.reconnectTimer){ clearTimeout(fb.reconnectTimer); fb.reconnectTimer = null; }
  fb.reconnectAttempts = 0;
  fb.currentConfig = null;
  fb.enabled = false; fb.status = 'off';
  clearSyncConfig();
  render();
}
window.addEventListener('online', ()=>{
  if(fb.enabled){ fb.status='online'; render(); }
  else if(fb.currentConfig){ if(fb.reconnectTimer){ clearTimeout(fb.reconnectTimer); fb.reconnectTimer = null; } fb.reconnectAttempts = 0; initSync(fb.currentConfig, true); }
});
window.addEventListener('offline', ()=>{ if(fb.enabled){ fb.status='offline'; render(); } });

function handleSyncError(err){
  fb.lastError = translateFirebaseError(err);
  if(err && err.code === 'permission-denied'){
    fb.enabled = false;
    fb.status = 'error';
    fb.lastError = 'Firestore rejected the connection (permission-denied). Your security rules likely require sign-in, but this device connected without it — update your Firestore rules to "allow read, write: if true;" (see the setup guide), or contact me to re-enable sign-in.';
    render();
    return;
  }
  // Any other listener error (network drop, server hiccup, etc.) — the live
  // subscription is dead at this point even though fb.enabled may still say
  // true, so without this the app would look "connected" while actually not
  // receiving or sending anything until someone manually reconnects.
  fb.enabled = false;
  fb.status = 'error';
  if(!isUserTypingNow() && !window.__hasUnsavedScoreEdits) render();
  scheduleReconnect();
}
function isUserTypingNow(){
  const el = document.activeElement;
  if(!el) return false;
  const tag = (el.tagName||'').toLowerCase();
  return tag==='input' || tag==='textarea' || tag==='select';
}
function attachSyncListeners(){
  fb.unsubs.forEach(u=>{ try{u();}catch(e){} });
  fb.unsubs = [];
  // Every collection below is kept live in sync across devices — any device
  // saving anything (even a completely different teacher, on a completely
  // different class) fires these listeners here too. Blindly calling
  // render() every time was wiping out whatever THIS device's user was
  // mid-typing into a score/remark field the instant an unrelated sync
  // event landed — which is what made scores look like they kept
  // "clearing" and forced teachers to re-enter them. We still apply the
  // incoming data to state immediately (so nothing is lost or stale), we
  // just skip the destructive re-render while the user has a form field
  // focused; the next natural render (on save, navigation, or blur) will
  // pick up the merged state correctly.
  function safeRender(){ if(!isUserTypingNow() && !window.__hasUnsavedScoreEdits) render(); }
  fb.unsubs.push(fb.db.collection('students').onSnapshot(snap=>{
    state.students = snap.docs.map(d=>d.data());
    safeRender();
  }, handleSyncError));
  fb.unsubs.push(fb.db.collection('scores').onSnapshot(snap=>{
    const obj = {}; snap.docs.forEach(d=>{ obj[d.id] = (d.data() && d.data().subjects) || {}; });
    state.scores = obj; safeRender();
  }, handleSyncError));
  fb.unsubs.push(fb.db.collection('remarks').onSnapshot(snap=>{
    const obj = {}; snap.docs.forEach(d=>{ obj[d.id] = d.data() || {}; });
    state.remarks = obj; safeRender();
  }, handleSyncError));
  fb.unsubs.push(fb.db.collection('users').onSnapshot(snap=>{
    if(snap.docs.length) state.users = snap.docs.map(d=>d.data());
    safeRender();
  }, handleSyncError));
  fb.unsubs.push(fb.db.collection('meta').doc('settings').onSnapshot(doc=>{
    if(doc.exists) state.settings = Object.assign(defaultState().settings, doc.data());
    safeRender();
  }, handleSyncError));
  fb.unsubs.push(fb.db.collection('meta').doc('appVersion').onSnapshot(async doc=>{
    const data = doc.exists ? doc.data() : null;
    if(!data || String(data.version) < CURRENT_APP_VERSION){
      // This device is running newer code than what's published — publish it
      // so other devices connected to the same project can pick it up.
      try{
        await fb.db.collection('meta').doc('appVersion').set({
          version: CURRENT_APP_VERSION,
          html: PRISTINE_HTML_SNAPSHOT,
          notes: (data && data.notes) || '',
          updatedAt: new Date().toISOString(),
        });
      }catch(e){ /* not critical, will retry on next connect */ }
    } else if(String(data.version) > CURRENT_APP_VERSION){
      fb.remoteVersion = data.version;
      fb.remoteHtml = data.html;
      fb.remoteNotes = data.notes || '';
      render();
    }
  }, err=>{ fb.lastError = err.message; }));
}

// Repository writers — no-ops when sync isn't enabled, so every existing local code path
// (which already updates `state` directly and calls saveState()) keeps working unchanged.
async function repoSaveStudent(student){ if(fb.enabled) try{ await fb.db.collection('students').doc(student.id).set(student, {merge:true}); }catch(e){ showToast('Saved locally — will sync when online.', true); } }
async function repoDeleteStudent(id){ if(fb.enabled) try{ await fb.db.collection('students').doc(id).delete(); }catch(e){} }
async function repoSaveScores(key, subjects, changedSubjects){
  if(!fb.enabled) return;
  try{
    // FIELD-LEVEL MERGE (fixes records disappearing with multiple teachers).
    // Previously this overwrote the ENTIRE subjects map for a student+term with
    // .set({subjects}). If two teachers entered scores for the SAME student+term
    // (e.g. the Maths teacher and the English teacher), whoever saved last wiped
    // out the other teacher's subjects — exactly the "records vanishing" bug.
    // Now we only write the specific subject(s) THIS teacher just changed, and
    // merge them into the server document, so every other teacher's subjects are
    // left untouched. Cleared subjects are removed with FieldValue.delete().
    const FieldValue = firebase.firestore.FieldValue;
    const list = (changedSubjects && changedSubjects.length) ? changedSubjects : Object.keys(subjects||{});
    const subjPatch = {};
    list.forEach(subj=>{
      subjPatch[subj] = (subjects && subjects[subj]!==undefined) ? subjects[subj] : FieldValue.delete();
    });
    await fb.db.collection('scores').doc(key).set({subjects: subjPatch}, {merge:true});
  }catch(e){ showToast('Saved locally — will sync when online.', true); }
}

async function repoPushAll(){
  if(!fb.enabled){ toast('Not connected yet — wait for the status to show Synced first.', true); return; }
  toast('Pushing to the cloud…');
  try{
    const batchSize = 400; // Firestore batch limit is 500 writes
    const ops = [];
    state.students.forEach(s=>ops.push(['students', s.id, s]));
    Object.keys(state.scores).forEach(k=>ops.push(['scores', k, {subjects: state.scores[k]}]));
    Object.keys(state.remarks).forEach(k=>ops.push(['remarks', k, state.remarks[k]]));
    state.users.forEach(u=>ops.push(['users', u.id, u]));
    ops.push(['meta', 'settings', state.settings]);
    for(let i=0;i<ops.length;i+=batchSize){
      const batch = fb.db.batch();
      // MERGE on every write (safer connect-time / manual push). A plain set()
      // replaces the whole document, so a device with a partial or stale local
      // copy could overwrite scores/subjects that OTHER teachers added but this
      // device hasn't received yet. With {merge:true}, Firestore merges nested
      // maps field-by-field, so pushing only ADDS/updates this device's data and
      // never deletes another teacher's subjects. This keeps the automatic seed
      // (when the cloud is empty) and the manual "Push to cloud" button safe.
      ops.slice(i,i+batchSize).forEach(([col,id,data])=>{ batch.set(fb.db.collection(col).doc(id), data, {merge:true}); });
      await withTimeout(batch.commit(), 15000, 'Push timed out — check your connection and try again.');
    }
    toast('Synced backup to the cloud for all devices.');
  }catch(e){ showToast('Could not push full backup to cloud: '+translateFirebaseError(e), true); }
}

function esc(str){ return String(str==null?'':str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function uid(){ return 'id_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function parseCSV(text){
  // Minimal CSV parser: handles quoted fields (with escaped "" and embedded commas/newlines).
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  const s = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  for(let i=0;i<s.length;i++){
    const c = s[i];
    if(inQuotes){
      if(c==='"'){ if(s[i+1]==='"'){ field+='"'; i++; } else { inQuotes=false; } }
      else field += c;
    } else {
      if(c==='"') inQuotes = true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field += c;
    }
  }
  if(field!=='' || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function bulkParseStudents(text){
  const rows = parseCSV(text);
  const valid = [], errors = [];
  if(rows.length===0){ errors.push('No data found.'); return {valid, errors}; }
  const header = rows[0].map(h=>h.trim().toLowerCase());
  const idx = name=>header.indexOf(name);
  const iName = idx('name'), iAdm = idx('admissionno'), iClass = idx('class');
  if(iName<0 || iAdm<0 || iClass<0){
    errors.push('Header row must include at least: Name, AdmissionNo, Class.');
    return {valid, errors};
  }
  const iGender = idx('gender'), iDob = idx('dob'), iHouse = idx('house'), iReligion = idx('religion'),
        iNat = idx('nationality'), iState = idx('state'), iLga = idx('lga'), iDept = idx('department');
  const known = allClasses();
  const seenAdmNos = new Set(state.students.map(s=>s.admissionNo.toLowerCase()));
  for(let r=1;r<rows.length;r++){
    const cells = rows[r];
    const rowNum = r+1;
    const name = (cells[iName]||'').trim();
    const admissionNo = (cells[iAdm]||'').trim();
    const clsRaw = (cells[iClass]||'').trim();
    if(!name && !admissionNo && !clsRaw) continue;
    if(!name || !admissionNo || !clsRaw){ errors.push(`Row ${rowNum}: Name, AdmissionNo, and Class are all required.`); continue; }
    const cls = known.find(c=>c.toLowerCase()===clsRaw.toLowerCase());
    if(!cls){ errors.push(`Row ${rowNum}: "${clsRaw}" isn't a class that exists in Settings.`); continue; }
    if(seenAdmNos.has(admissionNo.toLowerCase())){ errors.push(`Row ${rowNum}: Admission number "${admissionNo}" is already in use.`); continue; }
    let department = null;
    if(departmentsEnabledForClass(cls)){
      const deptRaw = iDept>=0 ? (cells[iDept]||'').trim() : '';
      if(deptRaw){
        const d = state.settings.departments.find(dd=>dd.key.toLowerCase()===deptRaw.toLowerCase() || dd.label.toLowerCase()===deptRaw.toLowerCase());
        if(!d){ errors.push(`Row ${rowNum}: "${deptRaw}" isn't a valid department (Science/Art/Commercial).`); continue; }
        department = d.key;
      } else {
        errors.push(`Row ${rowNum}: ${cls} requires a Department (Science, Art, or Commercial).`); continue;
      }
    }
    const genderRaw = iGender>=0 ? (cells[iGender]||'').trim() : '';
    const gender = /^f/i.test(genderRaw) ? 'Female' : /^m/i.test(genderRaw) ? 'Male' : 'Male';
    seenAdmNos.add(admissionNo.toLowerCase());
    valid.push({
      id: uid(), createdAt: Date.now(), name, admissionNo, class: cls, department, gender,
      dob: iDob>=0 ? (cells[iDob]||'').trim() : '',
      house: iHouse>=0 ? (cells[iHouse]||'').trim() : '',
      religion: iReligion>=0 ? (cells[iReligion]||'').trim() : '',
      nationality: iNat>=0 ? (cells[iNat]||'').trim() : 'Nigerian',
      stateOfOrigin: iState>=0 ? (cells[iState]||'').trim() : '',
      lga: iLga>=0 ? (cells[iLga]||'').trim() : '',
      address:'', bloodGroup:'', guardianName:'', guardianPhone:'', photo:null,
    });
  }
  return {valid, errors};
}

function reportDensityStyle(rowCount){
  // The score table sits in a column beside Skills/Behaviour/Key (not
  // stacked above them), so it has the full column height to itself and
  // isn't fighting them for page space. Budget is calibrated to the
  // confirmed-good 9-subject case, and tapers down for classes with more
  // subjects than that so the row height never grows enough to overflow
  // the (roughly fixed-height) Skills/Behaviour column beside it.
  const n = Math.max(rowCount, 1);
  const baseTarget = 220;
  const taper = Math.max(0, n - 9) * 6;
  const targetBodyHeightPx = Math.max(120, baseTarget - taper);
  const minRowPx = 10, maxRowPx = 34;
  let rowPx = Math.max(minRowPx, Math.min(maxRowPx, targetBodyHeightPx / n));
  const fontSizePrint = Math.max(6.5, Math.min(11, +(rowPx*0.33).toFixed(1)));
  const padYPrint = Math.max(0.8, +((rowPx - fontSizePrint*1.3 - 2) / 2).toFixed(1));
  const fontSize = +(fontSizePrint*1.12).toFixed(1);
  const padY = +(padYPrint*1.3).toFixed(1);
  return `--rs-pad-y:${padY}px;--rs-font:${fontSize}px;--rs-pad-y-print:${padYPrint}px;--rs-font-print:${fontSizePrint}px;`;
}
function gradeOf(pct){
  if(pct>=70) return {grade:'A', remark:'Excellent'};
  if(pct>=60) return {grade:'B', remark:'Very Good'};
  if(pct>=50) return {grade:'C', remark:'Good'};
  if(pct>=45) return {grade:'D', remark:'Pass'};
  if(pct>=40) return {grade:'E', remark:'Fair'};
  return {grade:'F', remark:'Fail'};
}

function computeStudentTermSummary(studentId, term){
  const key = scoreKey(studentId, term);
  const rec = state.scores[key];
  if(!rec) return null;
  const subjects = Object.keys(rec);
  if(subjects.length===0) return null;
  let sumGrand=0, count=0;
  const rows = subjects.map(subj=>{
    const s = rec[subj];
    const ca1=+s.ca1||0, ca2=+s.ca2||0, ca3=+s.ca3||0, exam=+s.exam||0;
    const totalCA = ca1+ca2+ca3, grand = totalCA+exam;
    sumGrand += grand; count++;
    const g = gradeOf((grand/gradingMax())*100);
    return {subject:subj, ca1,ca2,ca3,exam, totalCA, grand, grade:g.grade, remark:g.remark};
  });
  const avgPct = count ? (sumGrand/count/gradingMax()*100) : 0;
  return {rows, avgPct, subjectCount:count};
}

function subjectClassStats(className, subject, term){
  const classmates = state.students.filter(s=>s.class===className);
  const data = classmates.map(s=>{
    const rec = state.scores[scoreKey(s.id, term)];
    const sc = rec && rec[subject];
    if(!sc) return null;
    const total = (+sc.ca1||0)+(+sc.ca2||0)+(+sc.ca3||0)+(+sc.exam||0);
    return {id:s.id, total};
  }).filter(Boolean);
  if(!data.length) return null;
  const sorted = [...data].sort((a,b)=>b.total-a.total);
  const highest = sorted[0].total;
  const lowest = sorted[sorted.length-1].total;
  const avg = data.reduce((a,d)=>a+d.total,0)/data.length;
  return {highest, lowest, avg, sorted};
}

  if(!stats) return null;
  const idx = stats.sorted.findIndex(d=>d.id===studentId);
  if(idx<0) return null;
  let rank=1;
  const myTotal = stats.sorted[idx].total;
  for(let i=0;i<stats.sorted.length;i++){ if(stats.sorted[i].total>myTotal) rank++; }
  return rank;
}
function ageFromDob(dob){
  if(!dob) return null;
  const d = new Date(dob); if(isNaN(d)) return null;
  const now = new Date();
  let age = now.getFullYear() - d.getFullYear();
  const m = now.getMonth() - d.getMonth();
  if(m<0 || (m===0 && now.getDate()<d.getDate())) age--;
  return age>=0 ? age : null;
}

function fitAcademicToSide(){
  // reportDensityStyle() gives a good static starting size, but it can't know
  // how tall the Skills/Behaviour/Key column actually renders (that's fixed
  // content, independent of subject count) — so on classes with fewer/shorter
  // rows the score+grade column can end up shorter than that, leaving a blank
  // gap above Attendance. This measures the real rendered heights and grows
  // the score table's rows just enough to close that gap, so its bottom lines
  // up with the Key-of-Ratings box above the Attendance bar.
  const wrap = document.querySelector('.rs-academic-wrap');
  const side = document.querySelector('.rs-side');
  const table = document.querySelector('.rs-academic');
  const scaleTable = document.querySelector('.rs-scale-table');
  const thead = table && table.querySelector('thead');
  const tbody = table && table.querySelector('tbody');
  if(!wrap || !side || !table || !thead || !tbody) return;
  const n = tbody.querySelectorAll('tr').length;
  if(!n) return;

  const gapBetween = 6; // matches the CSS gap between the score table and the grade-scale table below it
  let pad = parseFloat(getComputedStyle(table).getPropertyValue('--rs-pad-y-print')) || 5;
  for(let pass=0; pass<6; pass++){
    const sideHeight = side.getBoundingClientRect().height;
    const scaleHeight = scaleTable ? scaleTable.getBoundingClientRect().height : 0;
    const theadHeight = thead.getBoundingClientRect().height;
    const bodyHeight = tbody.getBoundingClientRect().height;
    const available = sideHeight - scaleHeight - theadHeight - gapBetween;
    const diff = available - bodyHeight;
    if(Math.abs(diff) <= 1.5) break; // close enough — imperceptible
    if(diff < 0 && pad <= 0.8) break; // already shrunk as far as it can go; leave the static sizing's overflow-avoidance alone
    pad = Math.max(0.8, pad + diff / n / 2); // each px of top+bottom padding adds ~2px per row
    table.style.setProperty('--rs-pad-y-print', pad.toFixed(2)+'px');
  }
}

function showToast(msg, isError){
  const zone = document.getElementById('toast-zone');
  // avoid piling up identical messages if something is clicked repeatedly
  const dup = [...zone.children].find(c=>c.textContent===msg);
  if(dup) return;
  const el = document.createElement('div');
  el.className = 'toast'+(isError?' error':'');
  el.textContent = msg;
  zone.appendChild(el);
  while(zone.children.length > 3){ zone.removeChild(zone.firstChild); }
  setTimeout(()=>{ el.remove(); }, 2600);
}

    <button type="button" class="btn btn-danger btn-sm" id="modal-ok">Confirm</button></div></div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('#modal-cancel').onclick = ()=>wrap.remove();
  wrap.querySelector('#modal-ok').onclick = ()=>{ wrap.remove(); onYes(); };
}

function parseFirebaseConfig(raw){
  let text = raw.trim();
  text = text.replace(/^\s*(const|let|var)\s+\w+\s*=\s*/,'');
  text = text.replace(/;\s*$/,'');
  const start = text.indexOf('{');
  const end = text.lastIndexOf('}');
  if(start===-1 || end===-1 || end<start) return null;
  text = text.slice(start, end+1);
  try{ return JSON.parse(text); }catch(e){ /* fall through to lenient parse */ }
  try{
    const obj = Function('"use strict"; return (' + text + ');')();
    if(obj && typeof obj === 'object') return obj;
  }catch(e){ /* not parseable */ }
  return null;
}
function ordinal(n){ const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function todayFormatted(){
  const d = new Date();
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${ordinal(d.getDate())} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function bindLoginEvents(){
  if(state.authMode==='forgot'){ bindForgotEvents(); return; }
  if(state.authMode==='teacherSignup'){ bindTeacherSignupEvents(); return; }
  const pwHidden = document.getElementById('f-password');
  const pwVisible = document.getElementById('f-password-visible');
  // keep both inputs mirrored so no value is ever lost when switching which one is shown
  pwHidden.addEventListener('input', ()=>{ pwVisible.value = pwHidden.value; });
  pwVisible.addEventListener('input', ()=>{ pwHidden.value = pwVisible.value; });
  const toggleEye = document.getElementById('toggle-eye');
  if(toggleEye) toggleEye.onclick = ()=>{
    state.showPassword = !state.showPassword;
    if(state.showPassword){
      pwVisible.value = pwHidden.value;
      pwHidden.style.display = 'none'; pwVisible.style.display = '';
      pwVisible.focus();
    } else {
      pwHidden.value = pwVisible.value;
      pwVisible.style.display = 'none'; pwHidden.style.display = '';
      pwHidden.focus();
    }
    toggleEye.innerHTML = state.showPassword ? ICONS.eyeOff : ICONS.eye;
  };
  const forgotBtn = document.getElementById('forgot-btn');
  if(forgotBtn) forgotBtn.onclick = ()=>{ state.authMode='forgot'; state.forgotStep=1; state.authError=''; render(); };
  const signupBtn = document.getElementById('teacher-signup-btn');
  if(signupBtn) signupBtn.onclick = ()=>{ state.authMode='teacherSignup'; state.authError=''; render(); };
  const loginSyncBtn = document.getElementById('login-sync-btn');
  if(loginSyncBtn) loginSyncBtn.onclick = ()=>{ state.authMode='loginSync'; render(); };
  const loginSyncConnectBtn = document.getElementById('login-sync-connect-btn');
  if(loginSyncConnectBtn) loginSyncConnectBtn.onclick = async ()=>{
    if(loginSyncConnectBtn.disabled) return;
    const raw = document.getElementById('login-sync-config').value.trim();
    if(!raw){ toast('Paste the Sync Code your admin gave you first.', true); return; }
    const cfg = parseFirebaseConfig(raw);
    if(!cfg){ toast('That doesn\'t look right — ask your admin to re-send the Sync Code.', true); return; }
    const required = ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'];
    if(required.some(k=>!cfg[k])){ toast('That Sync Code looks incomplete — ask your admin to re-send it.', true); return; }
    loginSyncConnectBtn.disabled = true;
    try{ const ok = await initSync(cfg, false, raw); if(ok){ state.authMode='signin'; render(); } }
    finally{ loginSyncConnectBtn.disabled = false; }
  };
  const googleBtn = document.getElementById('google-signin-btn');
  if(googleBtn) googleBtn.onclick = async ()=>{
    if(googleBtn.disabled) return;
    if(!fb.app || typeof firebase === 'undefined'){
      toast('Connect this device to sync first (see "Connect now" below) — Google Sign-In needs that set up.', true);
      return;
    }
    googleBtn.disabled = true;
    try{
      const provider = new firebase.auth.GoogleAuthProvider();
      const result = await firebase.auth().signInWithPopup(provider);
      const email = result.user.email;
      const name = result.user.displayName || email;
      let user = state.users.find(u=>u.email && u.email.toLowerCase()===email.toLowerCase());
      if(!user){
        user = {id:uid(), role:'teacher', name, username: email.split('@')[0], email, password: uid(), assignedClasses:[], securityQuestion:SECURITY_QUESTIONS[0], securityAnswer:'', status:'pending', authProvider:'google'};
        state.users.push(user);
        saveState(); repoSaveUser(user);
        state.authNotice = 'Account created with your Google sign-in! An admin needs to approve you and assign your classes before you can sign in.';
        render();
        return;
      }
      if(user.status==='pending'){ state.authError = 'Your account is still awaiting admin approval.'; render(); return; }
      if(user.role!=='teacher'){ state.authError = 'This Google account is not linked to a teacher account.'; render(); return; }
      state.isLoggedIn = true; state.currentUserId = user.id; state.authError=''; state.view='dashboard';
      saveState(); render();
      toast('Welcome back, '+user.name+'.');
    }catch(e){
      toast('Google Sign-In failed: '+translateFirebaseError(e), true);
    } finally {
      googleBtn.disabled = false;
    }
  };
  const form = document.getElementById('auth-form');
  form.onsubmit = (e)=>{
    e.preventDefault();
    const selectedRole = document.getElementById('f-role').value;
    const username = document.getElementById('f-username').value.trim();
    const password = state.showPassword ? pwVisible.value : pwHidden.value;
    const remember = document.getElementById('f-remember').checked;
    const user = state.users.find(u=>u.username.toLowerCase()===username.toLowerCase() && u.password===password);
    if(user && user.role !== selectedRole){
      state.authError = `That account is registered as ${user.role==='admin'?'an Administrator':'a Teacher'} — switch "Login As" above and try again.`;
      render(); return;
    }
    if(user && user.status==='pending'){
      state.authError = 'Your account is still awaiting admin approval. Please check back once your admin has assigned your classes.';
      render(); return;
    }
    if(user){
      state.isLoggedIn = true;
      state.currentUserId = user.id;
      state.rememberMe = remember;
      state.authError=''; state.view='dashboard';
      saveState(); render();
      toast('Welcome back, '+user.name+'.');
    } else {
      state.authError = 'Incorrect username or password. Try again.';
      render();
    }
  };
}

    if(!cfg){ toast('That doesn\'t look right — ask your admin to re-send the Sync Code.', true); return; }
    const required = ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'];
    if(required.some(k=>!cfg[k])){ toast('That Sync Code looks incomplete — ask your admin to re-send it.', true); return; }
    tsConnectBtn.disabled = true;
    try{ await initSync(cfg, false, raw); }
    finally{ tsConnectBtn.disabled = false; }
  };
  const form = document.getElementById('teacher-signup-form');
  form.onsubmit = (e)=>{
    e.preventDefault();
    const name = document.getElementById('ts-name').value.trim();
    const username = document.getElementById('ts-username').value.trim();
    const password = document.getElementById('ts-password').value;
    const password2 = document.getElementById('ts-password2').value;
    const secQ = document.getElementById('ts-secq').value;
    const secA = document.getElementById('ts-seca').value.trim();
    if(!name || !username || !password || !secA){ state.authError = 'Please fill in every field.'; render(); return; }
    if(password.length<4){ state.authError = 'Password must be at least 4 characters.'; render(); return; }
    if(password!==password2){ state.authError = 'Passwords do not match.'; render(); return; }
    if(state.users.some(u=>u.username.toLowerCase()===username.toLowerCase())){
      state.authError = 'That username is already taken — please choose another.'; render(); return;
    }
    const newTeacher = {id:uid(), role:'teacher', name, username, password, assignedClasses:[], securityQuestion:secQ, securityAnswer:secA, status:'pending'};
    state.users.push(newTeacher);
    saveState(); repoSaveUser(newTeacher);
    state.authMode='signin'; state.authError='';
    state.authNotice = fb.enabled
      ? 'Account created and sent to your admin! They need to approve you and assign your classes before you can sign in. Please check back soon.'
      : 'Account created on this device, but it is NOT connected to sync — your admin will not see this request until this device connects. Please connect to sync (ask your admin for the Sync Code) as soon as possible, or tell your admin directly.';
    render();
  };
}
function bindForgotEvents(){
  const backBtn = document.getElementById('back-to-signin');
  if(backBtn) backBtn.onclick = ()=>{ state.authMode='signin'; state.authError=''; render(); };
  const form = document.getElementById('forgot-form');
  if(!form) return;
  form.onsubmit = (e)=>{
    e.preventDefault();
    if(state.forgotStep===1){
      const username = document.getElementById('fp-username').value.trim();
      const user = state.users.find(u=>u.username.toLowerCase()===username.toLowerCase());
      if(!user){ state.authError='No account found with that username.'; render(); return; }
      state.forgotUsername = username; state.forgotStep=2; state.authError=''; render();
    } else if(state.forgotStep===2){
      const answer = document.getElementById('fp-answer').value.trim();
      const user = state.users.find(u=>u.username.toLowerCase()===state.forgotUsername.toLowerCase());
      if(!user || user.securityAnswer.toLowerCase() !== answer.toLowerCase()){ state.authError='That answer does not match our records.'; render(); return; }
      state.forgotStep=3; state.authError=''; render();
    } else if(state.forgotStep===3){
      const p1 = document.getElementById('fp-newpass').value;
      const p2 = document.getElementById('fp-newpass2').value;
      if(p1.length<4){ state.authError='Password must be at least 4 characters.'; render(); return; }
      if(p1!==p2){ state.authError='Passwords do not match.'; render(); return; }
      const user = state.users.find(u=>u.username.toLowerCase()===state.forgotUsername.toLowerCase());
      user.password = p1;
      state.authMode='signin'; state.authError=''; state.authNotice='Password reset successfully. Please sign in.'; state.forgotStep=1;
      saveState(); repoSaveUser(user); render();
    }
  };
}

function bindRegisterEvents(){
  const photoInput = document.getElementById('reg-photo-input');
  if(photoInput) photoInput.onchange = (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ state._draftPhoto = reader.result; document.getElementById('reg-photo-preview').innerHTML = `<img src="${reader.result}">`; };
    reader.readAsDataURL(file);
  };
  // Level -> Class chip picker
  const classHidden = document.getElementById('reg-class');
  const classToggle = document.getElementById('reg-class-toggle');
  const levelToggle = document.getElementById('reg-level-toggle');
  const deptWrap = document.getElementById('reg-department-wrap');
  const deptToggle = document.getElementById('reg-department-toggle');
  const deptHidden = document.getElementById('reg-department');
  function selectDept(deptKey){
    deptToggle.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    const btn = deptKey ? deptToggle.querySelector(`[data-dept-chip="${deptKey}"]`) : null;
    if(btn) btn.classList.add('active');
    deptHidden.value = deptKey || '';
  }
  deptToggle.querySelectorAll('[data-dept-chip]').forEach(chip=>{
    chip.onclick = ()=>selectDept(chip.dataset.deptChip);
  });
  function updateDeptVisibility(className, keepDept){
    const enabled = departmentsEnabledForClass(className);
    deptWrap.style.display = enabled ? '' : 'none';
    if(!enabled){ deptHidden.value=''; deptToggle.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); }
    else if(!keepDept){ selectDept(null); }
  }
  function renderClassChips(levelKey, selectedClass){
    const g = state.settings.classGroups.find(gr=>gr.key===levelKey);
    if(!g){ classToggle.innerHTML=''; return; }
    classToggle.innerHTML = g.classes.map(c=>`<button type="button" class="chip ${c===selectedClass?'active':''}" data-class-chip-val="${esc(c)}">${esc(c)}</button>`).join('');
    classToggle.querySelectorAll('[data-class-chip-val]').forEach(chip=>{
      chip.onclick = ()=>{
        classToggle.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
        chip.classList.add('active');
        classHidden.value = chip.dataset.classChipVal;
        updateDeptVisibility(chip.dataset.classChipVal, false);
      };
    });
    updateDeptVisibility(selectedClass, true);
  }
  function selectLevel(levelKey, selectedClass){
    levelToggle.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    const lvlBtn = levelToggle.querySelector(`[data-level-chip="${levelKey}"]`);
    if(lvlBtn) lvlBtn.classList.add('active');
    renderClassChips(levelKey, selectedClass);
  }
  levelToggle.querySelectorAll('[data-level-chip]').forEach(btn=>{
    btn.onclick = ()=>{ selectLevel(btn.dataset.levelChip, null); classHidden.value = ''; updateDeptVisibility('', false); };
  });
  const form = document.getElementById('register-form');

    let initialLevel = state.settings.classGroups[0]?.key || null;
    let initialClass = null;
    let initialDept = null;
    if(state.selected.editingStudentId){
      const st = state.students.find(s=>s.id===state.selected.editingStudentId);
      if(st){
        document.getElementById('reg-name').value = st.name;
        document.getElementById('reg-admno').value = st.admissionNo;
        document.getElementById('reg-gender').value = st.gender;
        document.getElementById('reg-dob').value = st.dob||'';
        document.getElementById('reg-house').value = st.house||'';
        document.getElementById('reg-religion').value = st.religion||'';
        document.getElementById('reg-nationality').value = st.nationality||'Nigerian';
        document.getElementById('reg-state').value = st.stateOfOrigin||'';
        document.getElementById('reg-lga').value = st.lga||'';
        document.getElementById('reg-address').value = st.address||'';
        document.getElementById('reg-bloodgroup').value = st.bloodGroup||'';
        document.getElementById('reg-guardian').value = st.guardianName||'';
        document.getElementById('reg-phone').value = st.guardianPhone||'';
        state._draftPhoto = st.photo || null;
        if(st.photo) document.getElementById('reg-photo-preview').innerHTML = `<img src="${st.photo}">`;
        const g = groupForClass(st.class);
        if(g){ initialLevel = g.key; initialClass = st.class; initialDept = st.department||null; }
      }
    }
    if(initialLevel){ selectLevel(initialLevel, initialClass); classHidden.value = initialClass || (state.settings.classGroups.find(g=>g.key===initialLevel)?.classes[0] || ''); if(initialDept) selectDept(initialDept); }
